---
# ko's own default names its base by tag alone.
defaultBaseImage: gcr.io/distroless/static:nonroot@sha256:8ce6dd87e9823c5b48dcfb2c8604714ccb351ce59607327bcc4957448da279b5
builds:
  - id: kubehenge
    main: ./cmd/kubehenge
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    # As the Makefile's LDFLAGS: a third smaller, stack traces still named.
    ldflags:
      - -s
      - -w
      - -buildid=
