---
# ko's own default names its base by tag alone.
defaultBaseImage: gcr.io/distroless/static:nonroot@sha256:aafe993665bf6200db38a02c11a9351e782a84b6a45e7f33b6695638c88e3931
builds:
  - id: kubehenge
    main: ./cmd/kubehenge
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    # As the Makefile's LDFLAGS: a third smaller, stack traces still named.
    ldflags:
      - -s
      - -w
      - -buildid=
