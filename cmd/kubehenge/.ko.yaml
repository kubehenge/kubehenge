---
# ko's own default names its base by tag alone.
defaultBaseImage: gcr.io/distroless/static:nonroot@sha256:18f4cc26c9ffa7f20a359298be7deadac5c607c8e03a02b8119f1a5fc2f82c99
builds:
  - id: kubehenge
    main: ./cmd/kubehenge
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    # As the Makefile's LDFLAGS: a third smaller, stack traces still named.
    ldflags:
      - -s
      - -w
      - -buildid=
