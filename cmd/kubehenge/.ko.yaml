---
# ko's own default names its base by tag alone.
defaultBaseImage: gcr.io/distroless/static:nonroot@sha256:516757106de35205efb70b91ba03f6f1298424a0678c603255cf2852a7000087
builds:
  - id: kubehenge
    main: ./cmd/kubehenge
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    # As the Makefile's LDFLAGS: a third smaller, stack traces still named.
    ldflags:
      - -s
      - -w
      - -buildid=
