---
# ko's own default names its base by tag alone.
defaultBaseImage: gcr.io/distroless/static:nonroot@sha256:d62067879de890a1def9da0e7766b7d20810a5e5555cef8506b752437d7a3e88
builds:
  - id: kubehenge
    main: ./cmd/kubehenge
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    # As the Makefile's LDFLAGS: a third smaller, stack traces still named.
    ldflags:
      - -s
      - -w
      - -buildid=
