---
# What a pull request's new or changed dependencies may bring in. The licences are the permissive
# ones Kubehenge's dependencies carry, CC0-1.0, which gives its work to the public domain (the
# website's icon set), MPL-2.0, whose copyleft stays with its own files, and OFL-1.1, which lets
# the website's fonts be served with it; each combines with Kubehenge's Apache-2.0. The Go
# project's own modules add a patent grant to BSD-3-Clause, which the licence data names
# LicenseRef-scancode-google-patent-license-golang; it only gives rights. The Python Software
# Foundation's licences (argparse's, ported to JavaScript) are permissive as well.
allow-licenses:
  - Apache-2.0
  - BSD-2-Clause
  - BSD-3-Clause
  - CC0-1.0
  - ISC
  - LicenseRef-scancode-google-patent-license-golang
  - MIT
  - MPL-2.0
  - OFL-1.1
  - PSF-2.0
  - Python-2.0
# yamllint, under the GPL, only checks the repository's YAML in CI: nothing Kubehenge distributes
# includes or links it. spdystream's LICENSE is Apache-2.0 and its NOTICE adds only BSD-3-Clause
# code from the Go project; the licence data adds LicenseRef-scancode-unknown beside the two.
# ghodss/yaml's one LICENSE file holds MIT and the Go project's BSD-3-Clause, which the licence
# data names LicenseRef-bad-mit-bsd-3-clause. go-digest's code is Apache-2.0; CC-BY-SA-4.0 covers
# only its documentation (LICENSE.docs). runtime-spec is Apache-2.0; the DCO the licence data adds
# is the contributors' sign-off, which grants nothing and asks nothing of users.
allow-dependencies-licenses:
  - pkg:golang/github.com/ghodss/yaml
  - pkg:golang/github.com/moby/spdystream
  - pkg:golang/github.com/opencontainers/go-digest
  - pkg:golang/github.com/opencontainers/runtime-spec
  - pkg:pypi/yamllint
fail-on-severity: low
fail-on-scopes: [runtime, development, unknown]
# braces, with no fixed release, recurses without bound on deeply nested brace patterns. It comes
# only with markdownlint-cli2, which expands the repository's own Markdown globs with it and
# nothing a user sends.
allow-ghsas:
  - GHSA-vfj7-8cjw-p6xm
