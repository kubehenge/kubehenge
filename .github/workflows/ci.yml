---
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Go as scripts/tools.sh installs it, never a toolchain go.mod would have it download. Go does not
# retry a module download the proxy breaks off, so it fetches from the source then; go.sum and the
# checksum database still check every module.
env:
  GOTOOLCHAIN: local
  GOPROXY: https://proxy.golang.org|direct

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# A draft pull request runs only these fast checks on every push, and e2e.yml waits for it to be
# ready for review.
jobs:
  # Lint, unit and integration tiers: Go, the frontend, the OpenTofu module against mocked
  # providers, the Helm charts, the shell scripts, and the chart and controllers against a real API
  # server.
  # End-to-end tests need a Proxmox VE host (docs/testing.md).
  test:
    name: Test
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # What Go, npm and uv download and build, by the lock files they read. Only a push to main
      # saves it: a pull request's entry would serve no other run and push main's out of the
      # cache's 10 GB.
      - id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
            ~/.npm
            ~/.cache/uv
          key: >-
            ci-${{ hashFiles('go.sum', 'web/package-lock.json', 'scripts/lint/uv.lock') }}
          restore-keys: ci-
      # The tools by scripts/tools.sh's hash and the list named, downloaded only on a miss. Only
      # main saves, as above, and no job that publishes restores it.
      - id: tools
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/bin
          key: >-
            tools-${{ runner.os }}-${{ runner.arch }}-all-${{ hashFiles('scripts/tools.sh') }}
      - if: steps.tools.outputs.cache-hit != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/tools.sh "$RUNNER_TEMP/bin"
      - if: steps.tools.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/bin
          key: ${{ steps.tools.outputs.cache-primary-key }}
      - run: echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: make test
        env:
          # zizmor's online audits: impostor commits and actions with known vulnerabilities.
          GH_TOKEN: ${{ github.token }}
          # scripts/fetch.sh reads release files through the API when the download address fails.
          GITHUB_TOKEN: ${{ github.token }}
      - run: make integration
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # The providers from Kubehenge's forks, as their pins stand or as Renovate moves them.
      - run: make verify-providers
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
      - if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
            ~/.npm
            ~/.cache/uv
          key: ${{ steps.cache.outputs.cache-primary-key }}

  # The workflows are code with credentials attached, the release's among them, so actionlint and
  # zizmor check them in a job of their own as well as in `make test`: it answers within a minute,
  # and zizmor's findings are annotated on the lines they concern.
  workflows:
    name: Workflows
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: tools
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/bin
          key: >-
            tools-${{ runner.os }}-${{ runner.arch }}-actionlint+shellcheck+uv-${{
            hashFiles('scripts/tools.sh') }}
      - if: steps.tools.outputs.cache-hit != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/tools.sh "$RUNNER_TEMP/bin" actionlint shellcheck uv
      - if: steps.tools.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/bin
          key: ${{ steps.tools.outputs.cache-primary-key }}
      - run: echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: make lint-actions ZIZMOR_FLAGS=--format=github
        env:
          # zizmor's online audits: impostor commits and actions with known vulnerabilities.
          GH_TOKEN: ${{ github.token }}

  # The pull request's title and every commit subject in it stay within 72 characters, so they read
  # whole in git's one-line log and in GitHub's lists.
  subjects:
    name: Subjects
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - env:
          TITLE: ${{ github.event.pull_request.title }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          printf '%s\n' "$TITLE" | scripts/subjects.sh title || status=1
          git log --format=%s "$BASE..$HEAD" | scripts/subjects.sh commits || status=1
          exit "$status"

  # A pull request's new or changed dependencies: their licences and known vulnerabilities, against
  # .github/dependency-review-config.yml.
  dependencies:
    name: Dependencies
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          config-file: ./.github/dependency-review-config.yml
