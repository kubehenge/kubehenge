---
name: ci

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

# Go as scripts/tools.sh installs it, never a toolchain go.mod would have it download.
env:
  GOTOOLCHAIN: local

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint, unit and integration tiers: Go, the frontend, the OpenTofu module against mocked
  # providers, the Helm charts, the shell scripts, and the chart and controllers against a real API
  # server.
  # End-to-end tests need a Proxmox VE host (docs/testing.md).
  test:
    name: Test
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # What Go, npm and uv download and build, by the lock files they read.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
            ~/.npm
            ~/.cache/uv
          key: ci-${{ hashFiles('go.sum', 'web/package-lock.json', 'scripts/lint/uv.lock') }}
          restore-keys: ci-
      - name: Tools
        run: |
          scripts/tools.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: make test
        env:
          # zizmor's online audits: impostor commits and actions with known vulnerabilities.
          GH_TOKEN: ${{ github.token }}
      - run: make integration

  # A pull request's new or changed dependencies: their licences and known vulnerabilities, against
  # .github/dependency-review-config.yml.
  dependencies:
    name: Dependencies
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          config-file: ./.github/dependency-review-config.yml
