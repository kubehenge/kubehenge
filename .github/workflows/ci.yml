---
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Go as scripts/tools.sh installs it, never a toolchain go.mod would have it download. Go does not
# retry a module download the proxy breaks off, so it fetches from the source then; go.sum and the
# checksum database still check every module.
env:
  GOTOOLCHAIN: local
  GOPROXY: https://proxy.golang.org|direct

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# A draft pull request runs only these fast checks on every push, and e2e.yml waits for it to be
# ready for review.
jobs:
  # Lint, unit and integration tiers: Go, the frontend, the OpenTofu module against mocked
  # providers, the Helm charts, the shell scripts, and the chart and controllers against a real API
  # server.
  # End-to-end tests need a Proxmox VE host (docs/testing.md).
  # Each tier on its own runner, side by side: on one runner they took over 30 minutes from a cold
  # cache, and a pull request's runs always start cold.
  checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: Go lint, target: ci-lint-go}
          - {name: Lint, target: lint-other}
          - {name: Unit, target: unit}
          - {name: Integration, target: ci-integration}
    env:
      # zizmor's online audits: impostor commits and actions with known vulnerabilities.
      # verify-providers reads the forks' releases.
      GH_TOKEN: ${{ github.token }}
      # Pull requests show zizmor's findings on the lines they are about.
      ZIZMOR_FLAGS: --format=github
      # scripts/fetch.sh reads release files through the API when the download address fails.
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # What Go, golangci-lint, npm and uv download and build, by the lock files they read, one
      # entry per tier. Only a push to main saves it: a pull request's entry would serve no other
      # run and push main's out of the cache's 10 GB.
      - id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/.cache/golangci-lint
            ~/go/pkg/mod
            ~/.npm
            ~/.cache/uv
          key: >-
            ci-${{ matrix.target }}-${{
              hashFiles('go.sum', 'web/package-lock.json', 'scripts/lint/uv.lock') }}
          restore-keys: ci-${{ matrix.target }}-
      # The tools by scripts/tools.sh's hash and the list named, downloaded only on a miss. Only
      # main saves, as above, and no job that publishes restores it.
      - id: tools
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/bin
          key: >-
            tools-${{ runner.os }}-${{ runner.arch }}-all-${{ hashFiles('scripts/tools.sh') }}
      - if: steps.tools.outputs.cache-hit != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/tools.sh "$RUNNER_TEMP/bin"
      - if: steps.tools.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/bin
          key: ${{ steps.tools.outputs.cache-primary-key }}
      - run: echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - env:
          TARGET: ${{ matrix.target }}
        run: make "${TARGET}"
      - if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/.cache/golangci-lint
            ~/go/pkg/mod
            ~/.npm
            ~/.cache/uv
          key: ${{ steps.cache.outputs.cache-primary-key }}

  # The one check the ruleset requires, passing only when every tier passed.
  test:
    name: Test
    if: always()
    needs: checks
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - env:
          RESULT: ${{ needs.checks.result }}
        run: test "${RESULT}" = success

  # A pull request's new or changed dependencies: their licences and known vulnerabilities, against
  # .github/dependency-review-config.yml.
  dependencies:
    name: Dependencies
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          config-file: ./.github/dependency-review-config.yml
