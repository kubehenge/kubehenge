---
name: e2e image

# Proxmox VE's image for the end-to-end tests (test/e2e/pve), cached under its files' hash. The
# nightly run saves it too, but a change to those files would leave every lane of every run until
# then building it from Proxmox VE's repository, where one refused connection fails a lane. A cache
# saved on main is read by every branch and merge group.
on:
  push:
    branches: [main]
    paths: [test/e2e/pve/**, .github/workflows/e2e-image.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Proxmox VE's image
        run: |
          for try in 1 2 3; do
            docker build --progress=plain -t kubehenge-e2e-pve test/e2e/pve && break
            [ "${try}" = 3 ] && exit 1
            sleep 60
          done
          docker save kubehenge-e2e-pve | zstd -T0 -q -o "$RUNNER_TEMP/pve-image.tar.zst"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/pve-image.tar.zst
          key: e2e-pve-${{ hashFiles('test/e2e/pve/**') }}-${{ github.run_id }}
