---
name: release

# A version tag builds, signs and publishes a release (docs/releasing.md). Building, testing, the
# SBOMs and the signing all happen in release-build.yml, so that the identity Sigstore certifies is
# those build steps rather than this file's.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions: {}

# Two tags pushed together release one after the other, never at once: each index is made from the
# one before it.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: build
    if: github.repository == 'kubehenge/kubehenge'
    # A called workflow gets no more than its caller is given, and a job inside it that asks for
    # more stops the whole run before a single step.
    permissions:
      contents: read # The build reads the tagged source.
      checks: read # Only the gate job uses it, to read the checks the release commit passed.
      packages: write # Only the build and attest jobs use it, to push the images and signatures.
      id-token: write # Only the attest job uses it, to sign.
      attestations: write # Only the attest job uses it, to store the attestations.
    uses: ./.github/workflows/release-build.yml # zizmor: ignore[self-repository]
    secrets:
      RELEASE_KEY: ${{ secrets.RELEASE_KEY }}

  # What will ship has to verify the way a user verifies it, from the files alone, naming
  # release-build.yml at this tag as the builder; otherwise it only looks like proof. A job of its
  # own, holding nothing that can write.
  verify:
    name: verify
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read # Fetches scripts/tools.sh, to install cosign by its checksum.
      packages: read # Reads the images and their signatures, private on ghcr.io until made public.
    env:
      VERSION: ${{ needs.build.outputs.version }}
      CONTROLLER: ${{ needs.build.outputs.controller }}
      CAPMOX: ${{ needs.build.outputs.capmox }}
      HELM_ADDON: ${{ needs.build.outputs.helm-addon }}
      TALOS_CONTROL_PLANE: ${{ needs.build.outputs.talos-control-plane }}
      # The workflow that signed everything, as the certificates name it.
      SIGNER: ${{ github.repository }}/.github/workflows/release-build.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/tools.sh
          sparse-checkout-cone-mode: false
      - name: cosign
        run: |
          scripts/tools.sh "$RUNNER_TEMP/bin" cosign
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-sboms
          path: sbom
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-attestations
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-signature
          path: dist

      - name: Files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          (cd dist && sha256sum --check --strict "kubehenge_${VERSION}_SHA256SUMS")
          verify() {
            gh attestation verify "$@" --bundle "dist/kubehenge_${VERSION}.intoto.jsonl" \
              --repo "$GITHUB_REPOSITORY" --signer-workflow "$SIGNER" \
              --source-ref "$GITHUB_REF" --deny-self-hosted-runners
          }
          archive=dist/kubehenge_${VERSION}_linux_amd64.tar.gz
          for file in "$archive" "dist/kubehenge_${VERSION}_SHA256SUMS" dist/install.sh \
            dist/index.json dist/index.json.sig \
            "sbom/kubehenge_${VERSION}_linux_amd64.spdx.json"; do
            verify "$file"
          done
          verify "$archive" --predicate-type https://spdx.dev/Document/v2.3

      - name: Images
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          verify() {
            gh attestation verify "$@" --repo "$GITHUB_REPOSITORY" --signer-workflow "$SIGNER" \
              --source-ref "$GITHUB_REF" --deny-self-hosted-runners
          }
          for image in "ghcr.io/kubehenge/kubehenge@$CONTROLLER" \
            "ghcr.io/kubehenge/cluster-api-provider-proxmox@$CAPMOX" \
            "ghcr.io/kubehenge/cluster-api-addon-provider-helm@$HELM_ADDON" \
            "ghcr.io/kubehenge/cluster-api-control-plane-provider-talos@$TALOS_CONTROL_PLANE"; do
            verify "oci://$image"
            verify "oci://$image" --predicate-type https://spdx.dev/Document/v2.3
            cosign verify "$image" --certificate-identity "https://github.com/$SIGNER@$GITHUB_REF" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          done

  publish:
    name: publish
    needs: [build, verify]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write # Creates the release, uploads its files and publishes it.
    env:
      VERSION: ${{ needs.build.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-sboms
          path: sbom
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-attestations
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: notes
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-signature
          path: dist

      - name: Release
        run: |
          set -eu
          (cd dist && sha256sum --check --strict "kubehenge_${VERSION}_SHA256SUMS")
          # The GitHub CLI uploads the files to a draft and publishes it once they are all there, so
          # a failed run can leave a draft, never public, which is made again; a published release
          # is never rewritten.
          draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2> /dev/null) ||
            draft=none
          case $draft in
            none) ;;
            true) gh release delete "$GITHUB_REF_NAME" --yes ;;
            *)
              echo "::error::$GITHUB_REF_NAME is published already; raise the version instead"
              exit 1
              ;;
          esac
          gh release create "$GITHUB_REF_NAME" --verify-tag --latest \
            --title "Kubehenge $VERSION" --notes-file notes/notes.md \
            "dist/kubehenge_${VERSION}_linux_amd64.tar.gz" "dist/kubehenge_${VERSION}_SHA256SUMS" \
            dist/install.sh dist/index.json dist/index.json.sig \
            "sbom/kubehenge_${VERSION}_linux_amd64.spdx.json" \
            "dist/kubehenge_${VERSION}.intoto.jsonl"
