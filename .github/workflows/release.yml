---
name: release

# A version tag builds a release and leaves it as a draft: the index appliances upgrade from is
# signed offline by whoever holds the release key, never here (docs/releasing.md).
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions: {}

# Two tags pushed together release one after the other, never at once.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write # the draft release
      packages: write # the controller's and capmox's images on ghcr.io
      id-token: write # keyless image signature and build provenance
      attestations: write # build provenance stored with the repository
    env:
      IMAGE: ghcr.io/kubehenge/kubehenge
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No build caches: a cache written by another workflow's run could reach what is released.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          package-manager-cache: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - name: Tools
        run: |
          hack/tools.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Version
        id: version
        run: |
          version=${GITHUB_REF_NAME#v}
          chart=$(sed -n 's/^appVersion: //p' charts/kubehenge/Chart.yaml)
          fail() { echo "::error::$*"; exit 1; }
          [ "$version" = "$chart" ] ||
            fail "the tag is $GITHUB_REF_NAME but the chart's appVersion is $chart"
          [ -s pkg/release/release.pub ] ||
            fail "pkg/release/release.pub is missing: a build without it upgrades nothing"
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {p = 1; next} /^## \[/ {p = 0} p' \
            CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          [ -s "$RUNNER_TEMP/notes.md" ] || fail "CHANGELOG.md has no section for $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - run: make test
      - run: make integration

      - name: Controller image
        id: image
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "$GH_TOKEN" | ko login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          ref=$(make -s image IMAGE="$IMAGE" KO_FLAGS="--tags v$VERSION" | tail -n 1)
          case $ref in
            "$IMAGE"@sha256:*) ;;
            *) echo "::error::ko printed no image digest: $ref"; exit 1 ;;
          esac
          cosign sign --yes "$ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "digest=${ref#*@}" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: capmox image
        id: capmox
        run: |
          ref=$(make -s capmox-image | tail -n 1)
          case $ref in
            ghcr.io/kubehenge/cluster-api-provider-proxmox@sha256:*) ;;
            *) echo "::error::no capmox image digest: $ref"; exit 1 ;;
          esac
          cosign sign --yes "$ref"
          echo "digest=${ref#*@}" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/kubehenge/cluster-api-provider-proxmox
          subject-digest: ${{ steps.capmox.outputs.digest }}
          push-to-registry: true

      - name: Appliance archive and index
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CONTROLLER_IMAGE: ${{ steps.image.outputs.ref }}
        run: |
          make dist VERSION="$VERSION" CONTROLLER_IMAGE="$CONTROLLER_IMAGE"
          previous=
          if gh release view --json tagName >/dev/null 2>&1; then
            gh release download --pattern index.json --pattern index.json.sig \
              --dir "$RUNNER_TEMP/previous"
            previous=$RUNNER_TEMP/previous/index.json
          fi
          make index VERSION="$VERSION" PREVIOUS="$previous"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/kubehenge_${{ steps.version.outputs.version }}_linux_amd64.tar.gz
            dist/kubehenge_${{ steps.version.outputs.version }}_SHA256SUMS
            dist/install.sh
            dist/index.json

      - name: Draft release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "Kubehenge $VERSION" --notes-file "$RUNNER_TEMP/notes.md" \
            "dist/kubehenge_${VERSION}_linux_amd64.tar.gz" "dist/kubehenge_${VERSION}_SHA256SUMS" \
            dist/install.sh dist/index.json
