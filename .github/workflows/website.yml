---
name: website

# kubehenge.dev: built on every pull request that could change it, so a broken link fails there, and
# published from main.
on:
  pull_request:
    paths: [docs/**, website/**, web/src/logo.svg, scripts/tools.sh, .github/workflows/website.yml]
  push:
    branches: [main]
    paths: [docs/**, website/**, web/src/logo.svg, scripts/tools.sh, .github/workflows/website.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The pages' last-updated dates come from their history.
          fetch-depth: 0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: website-${{ hashFiles('website/package-lock.json') }}
          restore-keys: website-
      - name: Node
        run: |
          scripts/tools.sh "$RUNNER_TEMP/bin" node
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: make website
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/.vitepress/dist

  deploy:
    name: Deploy
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      pages: write # publishes the built site
      id-token: write # proves to Pages that this workflow built it
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
