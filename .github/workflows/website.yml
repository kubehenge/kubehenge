---
name: website

# kubehenge.dev: built on every pull request that could change it, so a broken link fails there, and
# published from main, with the release index appliances read signed again every week.
on:
  pull_request:
    paths: [docs/**, website/**, web/src/logo.svg, scripts/tools.sh, .github/workflows/website.yml]
  push:
    branches: [main]
    paths: [docs/**, website/**, web/src/logo.svg, scripts/tools.sh, .github/workflows/website.yml]
  # An index runs out two weeks after it is signed (pkg/release); a weekly run leaves a week to
  # spare. release.yml starts a run as well once it publishes a release.
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The latest release's index, signed again with a new expiry, so that an index held back from an
  # appliance stops being taken within two weeks. The only job here that holds the release key (the
  # release-index environment's secret, deployable from main alone). It checks out nothing and runs
  # no code but the kubehenge binary of the latest release, checked against its provenance, which
  # renews only an index its release keys signed and signs only with those keys.
  index:
    name: Release index
    if: github.event_name != 'pull_request' && github.repository == 'kubehenge/kubehenge'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment: release-index
    permissions:
      contents: read # Downloads the latest release's files.
    outputs:
      signed: ${{ steps.sign.outputs.signed }}
    steps:
      - id: sign
        name: Renew and sign
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_KEY: ${{ secrets.RELEASE_KEY }}
          RELEASE_KEY_NEXT: ${{ secrets.RELEASE_KEY_NEXT }}
          SIGNER: ${{ github.repository }}/.github/workflows/release-build.yml
        run: |
          set -eu
          fail() { echo "::error::$*"; exit 1; }
          if ! tag=$(gh release view --json tagName --jq .tagName 2> /dev/null); then
            echo "::notice::No release yet, so no index to publish."
            exit 0
          fi
          [ -n "$RELEASE_KEY" ] || fail "the release-index environment has no RELEASE_KEY secret"
          version=${tag#v}
          latest=$RUNNER_TEMP/latest
          archive=$latest/kubehenge_${version}_linux_amd64.tar.gz
          gh release download "$tag" --dir "$latest" --pattern index.json --pattern index.json.sig \
            --pattern "kubehenge_${version}_linux_amd64.tar.gz" \
            --pattern "kubehenge_${version}.intoto.jsonl"
          gh attestation verify "$archive" --bundle "$latest/kubehenge_${version}.intoto.jsonl" \
            --repo "$GITHUB_REPOSITORY" --signer-workflow "$SIGNER" --source-ref "refs/tags/$tag" \
            --deny-self-hosted-runners
          tar -xzf "$archive" -C "$RUNNER_TEMP" ./bin/kubehenge
          kubehenge=$RUNNER_TEMP/bin/kubehenge
          # A build without renew prints its group's help for "renew --help" and exits 0, so the
          # group's list of commands is what says whether it has one.
          if ! "$kubehenge" release --help | grep -Eq '^ +renew +'; then
            echo "::notice::$tag cannot sign its index again; the next release can."
            exit 0
          fi
          mkdir -p index/releases
          "$kubehenge" release renew "$latest/index.json" > index/releases/index.json
          trap 'rm -f "$RUNNER_TEMP"/release*.key' EXIT
          (umask 077 && printf '%s' "$RELEASE_KEY" > "$RUNNER_TEMP/release.key")
          set -- "$RUNNER_TEMP/release.key"
          if [ -n "$RELEASE_KEY_NEXT" ]; then
            (umask 077 && printf '%s' "$RELEASE_KEY_NEXT" > "$RUNNER_TEMP/release-next.key")
            set -- "$@" "$RUNNER_TEMP/release-next.key"
          fi
          "$kubehenge" release sign "$@" index/releases/index.json
          echo signed=true >> "$GITHUB_OUTPUT"
      - if: steps.sign.outputs.signed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-index
          path: index
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  build:
    name: Build
    needs: index
    # A pull request skips the index; the site is built all the same.
    if: ${{ !cancelled() && needs.index.result != 'failure' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The pages' last-updated dates come from their history.
          fetch-depth: 0
      # Only main saves, so a pull request's entry never pushes main's out of the cache.
      - id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: website-${{ hashFiles('website/package-lock.json') }}
          restore-keys: website-
      - name: Node
        run: |
          scripts/tools.sh "$RUNNER_TEMP/bin" node
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: make website
      # The build brings website/pages.json up to date, so a difference is a page change committed
      # without its new fingerprint and date.
      - name: Page dates
        run: |
          [ -z "$(git status --porcelain -- website/pages.json)" ] && exit 0
          git --no-pager diff -- website/pages.json
          echo "::error file=website/pages.json::Out of date: run make website and commit it."
          exit 1
      - if: >-
          github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
          && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - if: needs.index.outputs.signed == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-index
          path: website/.vitepress/dist
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/.vitepress/dist

  # Lighthouse CI over the built site on loopback, mobile and desktop, against the limits in
  # website/lighthouserc.cjs. The reports stay with the run, never on a public host.
  lighthouse:
    name: Lighthouse
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: website-${{ hashFiles('website/package-lock.json') }}
          restore-keys: website-
      - name: Node
        run: |
          scripts/tools.sh "$RUNNER_TEMP/bin" node
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # Ubuntu's AppArmor denies unprivileged user namespaces to programs without a profile of
      # their own, Playwright's Chromium among them, whose sandbox needs one. Allowing them here
      # keeps the sandbox, where --no-sandbox would drop it.
      - name: Chromium's sandbox
        run: sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0
      - run: make website-check
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse
          path: website/.vitepress/lighthouse
          if-no-files-found: ignore
          retention-days: 14

  deploy:
    name: Deploy
    needs: build
    if: >-
      ${{ !cancelled() && needs.build.result == 'success' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      pages: write # publishes the built site
      id-token: write # proves to Pages that this workflow built it
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # The pages this push changed, sent to IndexNow, which passes them on to Bing, Yandex and the
  # other engines that take part. A page changed when its fingerprint in website/pages.json moved.
  # Google reads the sitemap that robots.txt names. The key is public by design: the engines check
  # that the site serves it.
  indexnow:
    name: IndexNow
    needs: deploy
    if: ${{ !cancelled() && needs.deploy.result == 'success' && github.event_name == 'push' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read # Reads pages.json before and after the push.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Send the changed pages
        env:
          SITE: https://kubehenge.dev
          KEY: de4648cfd1ca935797a72233390428d9
          BEFORE: ${{ github.event.before }}
        run: |
          set -eu
          git show "$BEFORE:website/pages.json" > before.json 2> /dev/null ||
            echo '{}' > before.json
          jq -r --slurpfile before before.json --arg site "$SITE" '
            to_entries[]
            | select(.value.fingerprint != $before[0][.key].fingerprint)
            | $site + .key' website/pages.json > pages.txt
          if [ ! -s pages.txt ]; then
            echo "No page changed."
            exit 0
          fi
          jq -R . pages.txt | jq -s --arg host "${SITE#https://}" --arg key "$KEY" \
            --arg location "$SITE/$KEY.txt" \
            '{host: $host, key: $key, keyLocation: $location, urlList: .}' > body.json
          curl --fail-with-body --silent --show-error --retry 3 --request POST \
            --header 'Content-Type: application/json; charset=utf-8' --data @body.json \
            https://api.indexnow.org/indexnow
          echo "Sent $(wc -l < pages.txt) pages."
