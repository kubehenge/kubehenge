---
name: website

# kubehenge.dev: built on every pull request that could change it, so a broken link fails there, and
# published from main, with the release index appliances read signed again every week.
on:
  pull_request:
    paths: [docs/**, website/**, web/src/logo.svg, scripts/tools.sh, .github/workflows/website.yml]
  push:
    branches: [main]
    paths: [docs/**, website/**, web/src/logo.svg, scripts/tools.sh, .github/workflows/website.yml]
  # An index runs out two weeks after it is signed (pkg/release); a weekly run leaves a week to
  # spare. release.yml starts a run as well once it publishes a release.
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The latest release's index, signed again with a new expiry, so that an index held back from an
  # appliance stops being taken within two weeks. The only job here that holds the release key (the
  # release-index environment's secret, deployable from main alone). It checks out nothing and runs
  # no code but the kubehenge binary of the latest release, checked against its provenance, which
  # renews only an index its release keys signed and signs only with those keys.
  index:
    name: Release index
    if: github.event_name != 'pull_request' && github.repository == 'kubehenge/kubehenge'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment: release-index
    permissions:
      contents: read # Downloads the latest release's files.
    outputs:
      signed: ${{ steps.sign.outputs.signed }}
    steps:
      - id: sign
        name: Renew and sign
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_KEY: ${{ secrets.RELEASE_KEY }}
          RELEASE_KEY_NEXT: ${{ secrets.RELEASE_KEY_NEXT }}
          SIGNER: ${{ github.repository }}/.github/workflows/release-build.yml
        run: |
          set -eu
          fail() { echo "::error::$*"; exit 1; }
          if ! tag=$(gh release view --json tagName --jq .tagName 2> /dev/null); then
            echo "::notice::No release yet, so no index to publish."
            exit 0
          fi
          [ -n "$RELEASE_KEY" ] || fail "the release-index environment has no RELEASE_KEY secret"
          version=${tag#v}
          latest=$RUNNER_TEMP/latest
          archive=$latest/kubehenge_${version}_linux_amd64.tar.gz
          gh release download "$tag" --dir "$latest" --pattern index.json --pattern index.json.sig \
            --pattern "kubehenge_${version}_linux_amd64.tar.gz" \
            --pattern "kubehenge_${version}.intoto.jsonl"
          gh attestation verify "$archive" --bundle "$latest/kubehenge_${version}.intoto.jsonl" \
            --repo "$GITHUB_REPOSITORY" --signer-workflow "$SIGNER" --source-ref "refs/tags/$tag" \
            --deny-self-hosted-runners
          tar -xzf "$archive" -C "$RUNNER_TEMP" ./bin/kubehenge
          kubehenge=$RUNNER_TEMP/bin/kubehenge
          if ! "$kubehenge" release renew --help > /dev/null 2>&1; then
            echo "::notice::$tag cannot sign its index again; the next release can."
            exit 0
          fi
          mkdir -p index/releases
          "$kubehenge" release renew "$latest/index.json" > index/releases/index.json
          trap 'rm -f "$RUNNER_TEMP"/release*.key' EXIT
          (umask 077 && printf '%s' "$RELEASE_KEY" > "$RUNNER_TEMP/release.key")
          set -- "$RUNNER_TEMP/release.key"
          if [ -n "$RELEASE_KEY_NEXT" ]; then
            (umask 077 && printf '%s' "$RELEASE_KEY_NEXT" > "$RUNNER_TEMP/release-next.key")
            set -- "$@" "$RUNNER_TEMP/release-next.key"
          fi
          "$kubehenge" release sign "$@" index/releases/index.json
          echo signed=true >> "$GITHUB_OUTPUT"
      - if: steps.sign.outputs.signed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-index
          path: index
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  build:
    name: Build
    needs: index
    # A pull request skips the index; the site is built all the same.
    if: ${{ !cancelled() && needs.index.result != 'failure' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The pages' last-updated dates come from their history.
          fetch-depth: 0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: website-${{ hashFiles('website/package-lock.json') }}
          restore-keys: website-
      - name: Node
        run: |
          scripts/tools.sh "$RUNNER_TEMP/bin" node
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: make website
      - if: needs.index.outputs.signed == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-index
          path: website/.vitepress/dist
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/.vitepress/dist

  deploy:
    name: Deploy
    needs: build
    if: >-
      ${{ !cancelled() && needs.build.result == 'success' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      pages: write # publishes the built site
      id-token: write # proves to Pages that this workflow built it
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
