---
name: scorecard

# OpenSSF Scorecard: branch protection, pinned dependencies, token permissions and the rest,
# checked from outside and published, so the result is the same answer anyone can fetch. A change
# to a ruleset changes the score, so it runs then too.
on:
  branch_protection_rule:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: analysis
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      security-events: write # Uploads the result to code scanning.
      actions: read # Scorecard scores the CI checks from the workflow run history.
      contents: read # Reads the repository it is scoring.
      id-token: write # Signs the published result, so nothing but this workflow can forge it.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
