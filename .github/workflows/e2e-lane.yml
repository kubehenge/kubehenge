---
name: e2e lane

# One end-to-end lane, a test or two run one after the other (test/e2e/ci/scope.sh), in up to four
# tries (e2e-try.yml): a try whose runner lacks pause-loop exiting hands the lane to the next one on
# a fresh runner, and the last runs it wherever it lands. A try whose runner GitHub stops or loses
# hands it on as well, since it never ran its last step. A test that fails ends the lane.
# The calls keep the `./` form, which actionlint still requires; GitHub resolves a called workflow
# from this commit either way.
on:
  workflow_call:
    inputs:
      test:
        description: The test to run, as test/e2e/ci/run.sh names it.
        required: true
        type: string
      fresh:
        description: Whether to bake every template from the mirrors instead of the cache.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  try-1:
    name: try 1
    uses: ./.github/workflows/e2e-try.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read
      checks: write # The try's runner beacon (test/e2e/ci/beacon.sh).
    with:
      test: ${{ inputs.test }}
      fresh: ${{ inputs.fresh }}
  try-2:
    name: try 2
    needs: try-1
    if: >-
      !cancelled() && (needs.try-1.outputs.handed-back == 'true'
      || (needs.try-1.result == 'failure' && needs.try-1.outputs.ended != 'true'))
    uses: ./.github/workflows/e2e-try.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read
      checks: write # The try's runner beacon (test/e2e/ci/beacon.sh).
    with:
      test: ${{ inputs.test }}
      fresh: ${{ inputs.fresh }}
  try-3:
    name: try 3
    needs: try-2
    if: >-
      !cancelled() && (needs.try-2.outputs.handed-back == 'true'
      || (needs.try-2.result == 'failure' && needs.try-2.outputs.ended != 'true'))
    uses: ./.github/workflows/e2e-try.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read
      checks: write # The try's runner beacon (test/e2e/ci/beacon.sh).
    with:
      test: ${{ inputs.test }}
      fresh: ${{ inputs.fresh }}
  try-4:
    name: try 4
    needs: try-3
    if: >-
      !cancelled() && (needs.try-3.outputs.handed-back == 'true'
      || (needs.try-3.result == 'failure' && needs.try-3.outputs.ended != 'true'))
    uses: ./.github/workflows/e2e-try.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read
      checks: write # The try's runner beacon (test/e2e/ci/beacon.sh).
    with:
      test: ${{ inputs.test }}
      fresh: ${{ inputs.fresh }}
      last: true

  # The lane passes when its last try that ran ran the test and passed (test/e2e/ci/lane.sh).
  result:
    name: result
    needs: [try-1, try-2, try-3, try-4]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: test/e2e/ci/lane.sh
          sparse-checkout-cone-mode: false
      - env:
          TRIES: ${{ toJSON(needs) }}
          LANE: ${{ inputs.test }}
        run: printf '%s' "$TRIES" | test/e2e/ci/lane.sh "$LANE"
