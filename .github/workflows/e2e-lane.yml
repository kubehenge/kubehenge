---
name: e2e lane

# One end-to-end test, in up to four tries (e2e-try.yml): a try whose runner lacks pause-loop
# exiting hands the test to the next one on a fresh runner, and the last runs it wherever it lands.
# The calls keep the `./` form, which actionlint still requires; GitHub resolves a called workflow
# from this commit either way.
on:
  workflow_call:
    inputs:
      test:
        description: The test to run, as test/e2e/ci/run.sh names it.
        required: true
        type: string

permissions:
  contents: read

jobs:
  try-1:
    name: try 1
    uses: ./.github/workflows/e2e-try.yml # zizmor: ignore[self-repository]
    with:
      test: ${{ inputs.test }}
  try-2:
    name: try 2
    needs: try-1
    if: needs.try-1.outputs.handed-back == 'true'
    uses: ./.github/workflows/e2e-try.yml # zizmor: ignore[self-repository]
    with:
      test: ${{ inputs.test }}
  try-3:
    name: try 3
    needs: try-2
    if: needs.try-2.outputs.handed-back == 'true'
    uses: ./.github/workflows/e2e-try.yml # zizmor: ignore[self-repository]
    with:
      test: ${{ inputs.test }}
  try-4:
    name: try 4
    needs: try-3
    if: needs.try-3.outputs.handed-back == 'true'
    uses: ./.github/workflows/e2e-try.yml # zizmor: ignore[self-repository]
    with:
      test: ${{ inputs.test }}
      last: true

  # A try that hands the test back succeeds without running it, so the lane passes only when every
  # try that ran succeeded and one of them ran the test.
  result:
    name: result
    needs: [try-1, try-2, try-3, try-4]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - env:
          TRIES: ${{ toJSON(needs) }}
        run: |
          printf '%s' "$TRIES" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          printf '%s' "$TRIES" | jq -e '
            all(.[]; .result == "success" or .result == "skipped")
            and any(.[]; .result == "success" and .outputs["handed-back"] != "true")' > /dev/null
