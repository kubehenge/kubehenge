---
name: e2e

# No paths filter: a required check that never reports holds a pull request forever. The scope job
# decides instead.
# A pull request runs its tests once it is ready for review, on the merge ref, and the ruleset
# requires the branch to be up to date with main, so that tree is the one that lands. Main needs no
# run of its own on a push.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      tests:
        description: >-
          The tests to run, separated by spaces, as test/e2e/ci/run.sh names them, options
          included; none runs tonight's nightly set.
        type: string
        default: ''
      fresh:
        description: Bake every template from the mirrors, as the nightly run does.
        type: boolean
        default: false

permissions:
  contents: read

# A dispatch is a run someone asked for, so a later one on the same branch never cancels it.
concurrency:
  group: e2e-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  # A pull request that is not a draft, or a merge group, runs the tests its changes need
  # (test/e2e/ci/scope.sh), on the tree that would land on main. A draft runs none. The nightly run
  # (test/e2e/ci/nightly.sh) runs every test, adds the upgrade of the management cluster, Rancher,
  # a control plane of three servers and a Proxmox VE cluster of two nodes, and runs each workload
  # distribution once more on a CNI
  # and node OS other than its own and, every other night, without CIS hardening, in turn.
  scope:
    name: scope
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      tests: ${{ steps.scope.outputs.tests }}
    steps:
      # A pull request's merge ref or a merge group's commit. The merge ref's first parent is the
      # main commit under it, so a second commit gives the comparison its base. A merge group's base
      # is fetched below.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
          GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          ASKED: ${{ inputs.tests }}
        run: |
          case "$EVENT" in
            pull_request)
              if [ "$DRAFT" = true ]; then
                tests='[]'
              else
                # Without renames a moved file lists both paths, and quotepath off keeps a path
                # with non-ASCII characters whole.
                tests=$(git -c core.quotepath=off diff --name-only --no-renames HEAD^1 HEAD |
                  test/e2e/ci/scope.sh --base HEAD^1)
              fi
              ;;
            # A group holds one commit per pull request on top of main, so its changes are the
            # difference from main's commit under it.
            merge_group)
              git fetch --no-tags --depth=1 origin "$GROUP_BASE"
              # Without renames a moved file lists both paths, and quotepath off keeps a path with
              # non-ASCII characters whole.
              tests=$(git -c core.quotepath=off diff --name-only --no-renames "$GROUP_BASE" HEAD |
                test/e2e/ci/scope.sh --base "$GROUP_BASE")
              ;;
            # run.sh refuses a name it cannot read before anything is built.
            workflow_dispatch)
              tests=$(jq -nc --arg t "$ASKED" '$t | split(" ") | map(select(. != ""))')
              [ "$tests" != '[]' ] || tests=$(test/e2e/ci/nightly.sh)
              ;;
            *) tests=$(test/e2e/ci/nightly.sh) ;;
          esac
          echo "tests=$(printf '%s' "$tests" | jq -c .)" >> "$GITHUB_OUTPUT"

  # What every lane runs from the tree under test, built once (test/e2e/ci/build.sh): the kubehenge
  # binary, and the controller's, capmox's and the Add-on Provider for Helm's images in a registry's
  # storage, which each lane's registry serves under the same digests.
  build:
    name: build
    needs: scope
    if: needs.scope.outputs.tests != '[]'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
      GOPROXY: https://proxy.golang.org|direct
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Go's and npm's caches are e2e's own: the ci workflow's hold race-instrumented test builds,
      # none of the controller's and capmox's static builds. The nightly run and e2e-image.yml on
      # main save them and every other run reads them, so a pull request never fills the cache with
      # its own.
      - id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
            ~/.npm
          key: e2e-go-${{ hashFiles('go.sum', 'web/package-lock.json') }}-${{ github.run_id }}
          restore-keys: |
            e2e-go-${{ hashFiles('go.sum', 'web/package-lock.json') }}-
            e2e-go-
      - id: tools
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/bin
          key: tools-${{ runner.os }}-${{ runner.arch }}-all-${{ hashFiles('scripts/tools.sh') }}
      - if: steps.tools.outputs.cache-hit != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/tools.sh "$RUNNER_TEMP/bin"
      - if: steps.tools.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/bin
          key: ${{ steps.tools.outputs.cache-primary-key }}
      - run: echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Build
        run: |
          test/e2e/ci/build.sh "$RUNNER_TEMP/build"
          # The registry wrote its storage as root.
          sudo tar -C "$RUNNER_TEMP/build" -cf - . | zstd -T0 -q -o "$RUNNER_TEMP/e2e-build.tar.zst"
          ls -lh "$RUNNER_TEMP/e2e-build.tar.zst"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-build
          path: ${{ runner.temp }}/e2e-build.tar.zst
          compression-level: 0
          retention-days: 1
      - if: github.event_name == 'schedule'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
            ~/.npm
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  # Each lane (e2e-lane.yml), a test or two run one after the other, on a runner of its own, which
  # is handed to a fresh one when it lacks pause-loop exiting. A runner holds one management cluster
  # and one test's workload clusters at a time; the lane needs no secrets, so pull requests from
  # forks run it as they are.
  test:
    name: e2e (${{ matrix.test }})
    needs: [scope, build]
    if: needs.scope.outputs.tests != '[]'
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJSON(needs.scope.outputs.tests) }}
    uses: ./.github/workflows/e2e-lane.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read
      checks: write # Each try's runner beacon (test/e2e/ci/beacon.sh).
    with:
      test: ${{ matrix.test }}
      fresh: ${{ github.event_name == 'schedule' || inputs.fresh == true }}

  # The one check the main branch's ruleset requires: the matrix's tests differ by event, and a
  # draft, or a change to documentation only, skips them. A skipped job counts as a success to the
  # ruleset, and a check that never reports blocks the merge. A draft therefore reports this job
  # under another name, which leaves the required `e2e` pending until the pull request is ready
  # for review and its run reports.
  result:
    name: ${{ github.event.pull_request.draft && 'e2e (draft, not run)' || 'e2e' }}
    needs: [scope, build, test]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - env:
          SCOPE: ${{ needs.scope.result }}
          BUILD: ${{ needs.build.result }}
          TESTS: ${{ needs.test.result }}
        run: |
          echo "scope: $SCOPE, build: $BUILD, tests: $TESTS"
          [ "$SCOPE" = success ] && { [ "$BUILD" = success ] || [ "$BUILD" = skipped ]; } &&
            { [ "$TESTS" = success ] || [ "$TESTS" = skipped ]; }
