---
name: e2e

# No paths filter: a required check that never reports holds a pull request forever. The scope job
# decides instead.
# Main needs no run of its own on a push: the merge queue tested the same tree before it landed.
on:
  pull_request:
  merge_group:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A pull request runs the tests its changes need (test/e2e/ci/scope.sh); the merge queue runs
  # every pull request's test, and the nightly run adds the upgrade of the management cluster and
  # Rancher, the longest.
  scope:
    name: scope
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      tests: ${{ steps.scope.outputs.tests }}
    steps:
      # A pull request's merge commit and the base under it, which is all the comparison reads.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
        run: |
          case "$EVENT" in
            pull_request) tests=$(git diff --name-only HEAD^1 HEAD | test/e2e/ci/scope.sh) ;;
            merge_group) tests=$(test/e2e/ci/scope.sh --all) ;;
            *) tests='["management-cluster", "management-cluster-upgrade", "appliance", "kubeadm",
                 "rke2", "k3s", "rancher", "cluster-mesh"]' ;;
          esac
          echo "tests=$(printf '%s' "$tests" | jq -c .)" >> "$GITHUB_OUTPUT"

  # Up to four tries (e2e-lanes.yml): a test whose runner lacks pause-loop exiting goes to the next
  # try on a fresh runner, and the last one runs it wherever it lands. The calls keep the `./` form,
  # which actionlint still requires; GitHub resolves a called workflow from this commit either way.
  try-1:
    name: try 1
    needs: scope
    if: needs.scope.outputs.tests != '[]'
    uses: ./.github/workflows/e2e-lanes.yml # zizmor: ignore[self-repository]
    with:
      tests: ${{ needs.scope.outputs.tests }}
      try: 1
  try-2:
    name: try 2
    needs: try-1
    if: ${{ !cancelled() && needs.try-1.outputs.tests != '' && needs.try-1.outputs.tests != '[]' }}
    uses: ./.github/workflows/e2e-lanes.yml # zizmor: ignore[self-repository]
    with:
      tests: ${{ needs.try-1.outputs.tests }}
      try: 2
  try-3:
    name: try 3
    needs: try-2
    if: ${{ !cancelled() && needs.try-2.outputs.tests != '' && needs.try-2.outputs.tests != '[]' }}
    uses: ./.github/workflows/e2e-lanes.yml # zizmor: ignore[self-repository]
    with:
      tests: ${{ needs.try-2.outputs.tests }}
      try: 3
  try-4:
    name: try 4
    needs: try-3
    if: ${{ !cancelled() && needs.try-3.outputs.tests != '' && needs.try-3.outputs.tests != '[]' }}
    uses: ./.github/workflows/e2e-lanes.yml # zizmor: ignore[self-repository]
    with:
      tests: ${{ needs.try-3.outputs.tests }}
      try: 4
      last: true

  # The one check the main branch's ruleset requires: the tests differ by event, and a pull request
  # of documentation only skips them.
  result:
    name: e2e
    needs: [scope, try-1, try-2, try-3, try-4]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - env:
          SCOPE: ${{ needs.scope.result }}
          TRIES: >-
            ${{ needs.try-1.result }} ${{ needs.try-2.result }} ${{ needs.try-3.result }}
            ${{ needs.try-4.result }}
        run: |
          echo "scope: $SCOPE, tries: $TRIES"
          [ "$SCOPE" = success ] || exit 1
          for try in $TRIES; do
            [ "$try" = success ] || [ "$try" = skipped ] || exit 1
          done
