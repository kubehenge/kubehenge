---
name: e2e

# No paths filter: a required check that never reports holds a pull request forever. The scope job
# decides instead.
# Main needs no run of its own on a push: the merge queue tested the same tree before it landed.
on:
  pull_request:
  merge_group:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A pull request runs the tests its changes need (test/e2e/ci/scope.sh); the merge queue runs
  # every pull request's test, and the nightly run adds the upgrade of the management cluster and
  # Rancher, the longest.
  scope:
    name: scope
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      tests: ${{ steps.scope.outputs.tests }}
    steps:
      # A pull request's merge commit and the base under it, which is all the comparison reads.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
        run: |
          case "$EVENT" in
            pull_request) tests=$(git diff --name-only HEAD^1 HEAD | test/e2e/ci/scope.sh) ;;
            merge_group) tests=$(test/e2e/ci/scope.sh --all) ;;
            *) tests='["management-cluster", "management-cluster-upgrade", "appliance", "kubeadm",
                 "rke2", "k3s", "rancher", "cluster-mesh"]' ;;
          esac
          echo "tests=$(printf '%s' "$tests" | jq -c .)" >> "$GITHUB_OUTPUT"

  # Each test in a lane of its own (e2e-lane.yml), which hands it to a fresh runner when its runner
  # lacks pause-loop exiting. One test per runner, since a runner holds one management cluster and
  # one workload cluster; it needs no secrets, so pull requests from forks run it as they are.
  test:
    name: e2e (${{ matrix.test }})
    needs: scope
    if: needs.scope.outputs.tests != '[]'
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJSON(needs.scope.outputs.tests) }}
    uses: ./.github/workflows/e2e-lane.yml # zizmor: ignore[self-repository]
    with:
      test: ${{ matrix.test }}

  # The one check the main branch's ruleset requires: the matrix's tests differ by event, and a pull
  # request of documentation only skips them.
  result:
    name: e2e
    needs: [scope, test]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - env:
          SCOPE: ${{ needs.scope.result }}
          TESTS: ${{ needs.test.result }}
        run: |
          echo "scope: $SCOPE, tests: $TESTS"
          [ "$SCOPE" = success ] && { [ "$TESTS" = success ] || [ "$TESTS" = skipped ]; }
