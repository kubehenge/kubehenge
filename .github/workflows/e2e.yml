---
name: e2e

# No paths filter: a required check that never reports holds a pull request forever. The scope job
# decides instead.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A pull request that changes only documentation runs no end-to-end test.
  scope:
    name: scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      # A pull request's merge commit and the base under it, which is all the comparison reads.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
        run: |
          code=true
          docs='\.md$|^docs/|^\.github/ISSUE_TEMPLATE/'
          if [ "$EVENT" = pull_request ] && ! git diff --name-only HEAD^1 HEAD | grep -qvE "$docs"; then
            code=false
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  # End-to-end tier: Proxmox VE runs in a container on the runner (test/e2e/pve) and starts the
  # clusters' VMs on the runner's KVM. One test per runner, since a runner holds one management
  # cluster and one workload cluster; the job needs no secrets, so pull requests from forks run it
  # as they are.
  test:
    name: e2e (${{ matrix.test }})
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # The upgrade of the management cluster and Rancher, the longest, run nightly and on demand.
        test: >-
          ${{ fromJSON(contains(fromJSON('["pull_request", "push"]'), github.event_name)
          && '["management-cluster", "appliance", "templates", "kubeadm", "rke2", "k3s", "volumes"]'
          || '["management-cluster", "management-cluster-upgrade", "appliance", "templates",
               "kubeadm", "rke2", "k3s", "volumes", "rancher"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Tools
        run: |
          scripts/tools.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: KVM and memory
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm.rules >/dev/null
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          test -c /dev/kvm
          # A cushion only: guests swapped out run slowly, but a run short of memory loses a VM to
          # the OOM killer.
          sudo fallocate -l 8G /mnt/e2e.swap && sudo chmod 600 /mnt/e2e.swap
          sudo mkswap /mnt/e2e.swap >/dev/null && sudo swapon /mnt/e2e.swap
          nproc && free -m && df -h / /mnt
      - name: Proxmox VE
        run: test/e2e/ci/up.sh "$RUNNER_TEMP/e2e"
      - name: ${{ matrix.test }}
        env:
          TEST: ${{ matrix.test }}
        run: test/e2e/ci/run.sh "$RUNNER_TEMP/e2e" "$TEST"
      - name: Collect
        if: failure()
        run: |
          out="$RUNNER_TEMP/artifacts" && mkdir -p "$out"
          free -m > "$out/memory.txt"; sudo dmesg | tee "$out/dmesg.txt" >/dev/null || true
          pve() { docker exec kubehenge-e2e-pve "$@"; }
          pve journalctl -b --no-pager > "$out/proxmox-journal.txt" || true
          pve qm list > "$out/vms.txt" || true
          cp "$RUNNER_TEMP/e2e/apply.log" "$out/" 2>/dev/null || true
          if [ -f "$RUNNER_TEMP/e2e/kubeconfig.yaml" ]; then
            export KUBECONFIG="$RUNNER_TEMP/e2e/kubeconfig.yaml"
            kubectl get clusters,machines,pods -A -o wide \
              > "$out/management-cluster.txt" 2>&1 || true
            kubectl get events -A --sort-by=.lastTimestamp > "$out/events.txt" 2>&1 || true
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-${{ matrix.test }}
          path: ${{ runner.temp }}/artifacts
          retention-days: 7

  # The one check the main branch's ruleset requires: the matrix's jobs differ by event, and a pull
  # request of documentation only skips them.
  result:
    name: e2e
    needs: [scope, test]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          SCOPE: ${{ needs.scope.result }}
          TESTS: ${{ needs.test.result }}
        run: |
          echo "scope: $SCOPE, tests: $TESTS"
          [ "$SCOPE" = success ] && { [ "$TESTS" = success ] || [ "$TESTS" = skipped ]; }
