---
name: e2e

# No paths filter: a required check that never reports holds a pull request forever. The scope job
# decides instead.
# Main needs no run of its own on a push: the merge queue tested the same tree before it landed.
on:
  pull_request:
  merge_group:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      tests:
        description: >-
          The tests to run, separated by spaces, as test/e2e/ci/run.sh names them, options
          included; none runs tonight's nightly set.
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A merge group runs the tests its pull requests' changes need together (test/e2e/ci/scope.sh),
  # on the tree that would land on main; a pull request runs none, since the queue runs them on
  # exactly what lands and a second run on the pull request only doubles the wait. The nightly run
  # (test/e2e/ci/nightly.sh) runs every test, adds the upgrade of the management cluster, Rancher
  # and a control plane of three servers, and runs each workload distribution once more on a CNI
  # and node OS other than its own and, every other night, without CIS hardening, in turn.
  scope:
    name: scope
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      tests: ${{ steps.scope.outputs.tests }}
    steps:
      # A merge group's commit; the comparison fetches main's commit under it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          ASKED: ${{ inputs.tests }}
        run: |
          case "$EVENT" in
            pull_request) tests='[]' ;;
            # A group holds one commit per pull request on top of main, so its changes are the
            # difference from main's commit under it.
            merge_group)
              git fetch --no-tags --depth=1 origin "$GROUP_BASE"
              tests=$(git diff --name-only "$GROUP_BASE" HEAD | test/e2e/ci/scope.sh)
              ;;
            # run.sh refuses a name it cannot read before anything is built.
            workflow_dispatch)
              tests=$(jq -nc --arg t "$ASKED" '$t | split(" ") | map(select(. != ""))')
              [ "$tests" != '[]' ] || tests=$(test/e2e/ci/nightly.sh)
              ;;
            *) tests=$(test/e2e/ci/nightly.sh) ;;
          esac
          echo "tests=$(printf '%s' "$tests" | jq -c .)" >> "$GITHUB_OUTPUT"

  # Each test in a lane of its own (e2e-lane.yml), which hands it to a fresh runner when its runner
  # lacks pause-loop exiting. One test per runner, since a runner holds one management cluster and
  # one workload cluster; it needs no secrets, so pull requests from forks run it as they are.
  test:
    name: e2e (${{ matrix.test }})
    needs: scope
    if: needs.scope.outputs.tests != '[]'
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJSON(needs.scope.outputs.tests) }}
    uses: ./.github/workflows/e2e-lane.yml # zizmor: ignore[self-repository]
    with:
      test: ${{ matrix.test }}

  # The one check the main branch's ruleset requires: the matrix's tests differ by event, and a pull
  # request, or a merge group of documentation only, skips them.
  result:
    name: e2e
    needs: [scope, test]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - env:
          SCOPE: ${{ needs.scope.result }}
          TESTS: ${{ needs.test.result }}
        run: |
          echo "scope: $SCOPE, tests: $TESTS"
          [ "$SCOPE" = success ] && { [ "$TESTS" = success ] || [ "$TESTS" = skipped ]; }
