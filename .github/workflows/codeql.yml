---
name: codeql

# CodeQL over every language the repository is written in: the Go of the controller, interface
# backend and CLI, the TypeScript of the interface and the Proxmox VE entry's JavaScript, and the
# workflows themselves. The security-and-quality suite as .github/codeql-config.yml narrows it, as a
# check on every pull request.
on:
  push:
    branches: [main]
  # Every pull request, whatever it targets, so that one stacked on another is checked too.
  pull_request:
  # A query pack that learns a new pattern finds it in code that has not changed since.
  schedule:
    - cron: '29 3 * * 3'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyse:
    name: codeql (${{ matrix.language }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          # Go is read from a build, which needs no frontend: the embedded directory keeps a .keep.
          - language: go
            build-mode: autobuild
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read # Reads the source it analyses.
      security-events: write # Uploads the findings to code scanning.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: tools
        if: matrix.language == 'go'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/bin
          key: tools-${{ runner.os }}-${{ runner.arch }}-go-${{ hashFiles('scripts/tools.sh') }}
      - name: Go
        if: matrix.language == 'go' && steps.tools.outputs.cache-hit != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/tools.sh "$RUNNER_TEMP/bin" go
      - if: >-
          matrix.language == 'go' && steps.tools.outputs.cache-hit != 'true'
          && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/bin
          key: ${{ steps.tools.outputs.cache-primary-key }}
      - if: matrix.language == 'go'
        run: |
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          echo GOTOOLCHAIN=local >> "$GITHUB_ENV"
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql-config.yml
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
