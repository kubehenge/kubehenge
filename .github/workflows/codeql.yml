---
name: codeql

# CodeQL over every language the repository is written in: the Go of the controller, interface
# backend and CLI, the TypeScript of the interface and the Proxmox VE entry's JavaScript, and the
# workflows themselves. The security-and-quality suite as .github/codeql-config.yml narrows it, as a
# check on every pull request.
on:
  push:
    branches: [main]
  # Every pull request, whatever it targets, so that one stacked on another is checked too.
  pull_request:
  merge_group:
  # A query pack that learns a new pattern finds it in code that has not changed since.
  schedule:
    - cron: '29 3 * * 3'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyse:
    name: codeql (${{ matrix.language }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          # Go is read from a build, which needs no frontend: the embedded directory keeps a .keep.
          - language: go
            build-mode: autobuild
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read # Reads the source it analyses.
      security-events: write # Uploads the findings to code scanning.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Go
        if: matrix.language == 'go'
        run: |
          scripts/tools.sh "$RUNNER_TEMP/bin" go
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          echo GOTOOLCHAIN=local >> "$GITHUB_ENV"
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql-config.yml
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:${{ matrix.language }}
