network:
  version: 2
  renderer: networkd
  ethernets:
    eth0:
      match:
        macaddress: bc:24:11:00:00:01
      dhcp4: false
      dhcp6: false
      addresses:
        - '192.0.2.21/24'
        - '2001:db8::21/64'
      routes:
        - { "to": "0.0.0.0/0", "via": "192.0.2.1", "metric": 100, }
        - { "to": "::/0", "via": "2001:db8::1", "metric": 100, }
      nameservers:
        addresses:
          - '192.0.2.1'
