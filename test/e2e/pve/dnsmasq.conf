# The VMs' name server on their bridge, so that they need no public one: dnsmasq asks the name
# server in /etc/resolv.conf, the container runtime's, which asks the machine's own. bind-dynamic,
# since vmbr0 may come up after dnsmasq has started. It answers on the bridge's IPv6 address too,
# for dual-stack clusters.
interface=vmbr0
bind-dynamic
