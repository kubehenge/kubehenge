{{- $class := "kubehenge-rke2" }}
{{- $clusterSpec := include "kubehenge.proxmoxClusterSpec" . }}
{{- /* Placeholder tags: the controller's patch selects the build of the node OS's template. */}}
{{- $machineSpec := include "kubehenge.proxmoxMachineSpec" (dict "tags" (list "kubehenge" "os-almalinux-10" "rke2") "serviceJoins" true) }}
{{- $controlPlaneSpec := include "kubehenge.rke2ControlPlaneSpec" . }}
{{- $workerSpec := include "kubehenge.rke2WorkerSpec" . }}
{{- $clusterName := include "kubehenge.hashedName" (dict "name" $class "spec" $clusterSpec) }}
{{- $machineName := include "kubehenge.hashedName" (dict "name" (printf "%s-machine" $class) "spec" $machineSpec) }}
{{- $controlPlaneName := include "kubehenge.hashedName" (dict "name" (printf "%s-control-plane" $class) "spec" $controlPlaneSpec) }}
{{- $workerName := include "kubehenge.hashedName" (dict "name" (printf "%s-worker" $class) "spec" $workerSpec) }}
apiVersion: cluster.x-k8s.io/v1beta2
kind: ClusterClass
metadata:
  name: {{ $class }}
  namespace: {{ .Release.Namespace }}
  annotations:
    # RKE2's own ranges, for a Cluster that sets none.
    kubehenge.dev/default-pods: 10.42.0.0/16
    kubehenge.dev/default-services: 10.43.0.0/16
    # RKE2's server sizing guide: the control planes' least vCPUs and memory from a number of workers.
    kubehenge.dev/control-plane-sizes: '[{"workers":0,"cores":2,"memoryMiB":4096},{"workers":226,"cores":4,"memoryMiB":8192},{"workers":451,"cores":8,"memoryMiB":16384},{"workers":1301,"cores":16,"memoryMiB":32768}]'
    {{- include "kubehenge.addonMemory" . | nindent 4 }}
    {{- include "kubehenge.addonControlPlaneMemory" . | nindent 4 }}
    {{- include "kubehenge.backupTargets" . | nindent 4 }}
    # What a node uses before any add-on, measured by the end-to-end tests: a control plane with a
    # quarter on top, which the kernel's caches and the API server's peaks take; a worker with a tenth.
    kubehenge.dev/node-memory: '{"controlPlane":3120,"worker":704}'
    {{- if .Values.proxmox.ha }}
    # Tells the interface to offer the proxmoxHA variable: an administrator switched Proxmox VE HA on.
    kubehenge.dev/proxmox-ha: "true"
    {{- end }}
    {{- if .Values.proxmox.datastoreAllocate.role }}
    # Tells the interface to offer the csi variable's datastoreAllocate, on the storages the
    # management cluster does not use: an administrator let clusters choose it.
    kubehenge.dev/datastore-allocate: "true"
    kubehenge.dev/management-storages: {{ join "," .Values.proxmox.datastoreAllocate.managementStorages | quote }}
    {{- end }}
    {{- if .Values.proxmox.sysAuditGroup }}
    # Tells the interface to offer the ccm variable's haGroups: an administrator let clusters hold
    # Sys.Audit on /.
    kubehenge.dev/sys-audit: "true"
    {{- end }}
    {{- if .Values.proxmox.volumeSnapshots.rootSecret }}
    # Tells the interface to offer the csi variable's volumeSnapshots: an administrator stored
    # root@pam's password for it.
    kubehenge.dev/volume-snapshots: "true"
    {{- end }}
    {{- include "kubehenge.etcdRestore" . | nindent 4 }}
spec:
  infrastructure:
    templateRef:
      apiVersion: infrastructure.cluster.x-k8s.io/v1alpha2
      kind: ProxmoxClusterTemplate
      name: {{ $clusterName }}
  controlPlane:
    templateRef:
      apiVersion: controlplane.cluster.x-k8s.io/v1beta2
      kind: RKE2ControlPlaneTemplate
      name: {{ $controlPlaneName }}
    machineInfrastructure:
      templateRef:
        apiVersion: infrastructure.cluster.x-k8s.io/v1alpha2
        kind: ProxmoxMachineTemplate
        name: {{ $machineName }}
    naming:
      template: {{ "{{ .cluster.name }}-control-plane-{{ .random }}" | quote }}
    healthCheck:
      {{- include "kubehenge.healthCheck" "controlPlane" | nindent 6 }}
  workers:
    machineDeployments:
      - class: worker
        naming:
          template: {{ "{{ .cluster.name }}-{{ .machineDeployment.topologyName }}-{{ .random }}" | quote }}
        bootstrap:
          templateRef:
            apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
            kind: RKE2ConfigTemplate
            name: {{ $workerName }}
        infrastructure:
          templateRef:
            apiVersion: infrastructure.cluster.x-k8s.io/v1alpha2
            kind: ProxmoxMachineTemplate
            name: {{ $machineName }}
        healthCheck:
          {{- include "kubehenge.healthCheck" "workers" | nindent 10 }}
  variables:
    {{- /* RKE2's static pods request 2 GiB between them (etcd, API server, controller manager, scheduler, kube-proxy). */}}
    {{- include "kubehenge.proxmoxVariables" (dict "controlPlaneDiskGiB" 30 "workerDiskGiB" 40 "minDiskGiB" 20 "workerMinCores" 2 "workerMinMemoryMiB" 4096 "clusters" .Values.clusters) | nindent 4 }}
    {{- include "kubehenge.addonVariables" . | nindent 4 }}
    {{- include "kubehenge.upgradeVariables" . | nindent 4 }}
    {{- include "kubehenge.nodeOSVariable" . | nindent 4 }}
    {{- include "kubehenge.autoscalerVariable" . | nindent 4 }}
    {{- include "kubehenge.oidcVariable" . | nindent 4 }}
    {{- include "kubehenge.cisVariable" . | nindent 4 }}
    - name: cni
      required: false
      schema:
        openAPIV3Schema:
          type: string
          description: The CNI plugin, fixed once the cluster exists. RKE2's own default is canal.
          enum: [canal, calico, cilium]
          default: canal
          {{- include "kubehenge.cniFixed" . | nindent 10 }}
  patches:
    {{- include "kubehenge.proxmoxPatches" . | nindent 4 }}
    - name: rke2-control-plane
      definitions:
        - selector:
            apiVersion: controlplane.cluster.x-k8s.io/v1beta2
            kind: RKE2ControlPlaneTemplate
            matchResources:
              controlPlane: true
          jsonPatches:
            - op: add
              path: /spec/template/spec/files/-
              valueFrom:
                template: |
                  {{- include "kubehenge.kubeVipFile" (dict "root" . "path" "/var/lib/rancher/rke2/agent/pod-manifests/kube-vip.yaml" "kubeconfig" "/etc/rancher/rke2/rke2.yaml") | nindent 18 }}
            - op: add
              path: /spec/template/spec/files/-
              valueFrom:
                template: |
                  {{- include "kubehenge.admissionFile" (dict "root" . "path" "/etc/rancher/rke2/pod-security.yaml") | nindent 18 }}
            - op: add
              path: /spec/template/spec/serverConfig/kubeAPIServer/extraEnv
              valueFrom:
                template: |
                  GOMEMLIMIT: {{ include "kubehenge.apiServerMemoryLimit" (dict "share" 40) }}
            # The file is on the control planes before RKE2 starts, so its Traefik never runs on
            # RKE2's own values. RKE2's Traefik tolerates no taint, so it would leave the control planes once a
            # worker joins, and the cluster's API address would serve no ingress. Routes whose TLS
            # options conflict fail rather than fall back to the defaults, which would drop a host's
            # client-certificate check (GHSA-g55h-rg46-x9c5). Its Gateway API provider is on, as in
            # the Traefik Kubehenge installs into kubeadm clusters. What follows the cluster's
            # certificates comes from the values Secret it names, which Kubehenge keeps in the
            # running cluster: in the file, every change of it would replace the control planes.
            - op: add
              path: /spec/template/spec/files/-
              valueFrom:
                template: |
                  path: /var/lib/rancher/rke2/server/manifests/rke2-traefik-config.yaml
                  owner: root:root
                  permissions: "0600"
                  content: |
                    apiVersion: helm.cattle.io/v1
                    kind: HelmChartConfig
                    metadata:
                      name: rke2-traefik
                      namespace: kube-system
                    spec:
                      {{- include "kubehenge.traefikValuesSecrets" . | nindent 22 }}
                      valuesContent: |-
                        core:
                          strictTLSOptions: true
                        tolerations:
                          - key: node-role.kubernetes.io/control-plane
                            operator: Exists
                            effect: NoSchedule
                        providers:
                          kubernetesGateway:
                            enabled: true
                            statusAddress:
                              ip: {{ "{{ .controlPlaneEndpoint | quote }}" }}
                        {{- include "kubehenge.traefikGatewayValues" . | nindent 24 }}
            - op: add
              path: /spec/template/spec/serverConfig/cni
              valueFrom:
                variable: cni
    # The RKE2 provider's own etcd.backupConfig would write the store's keys into the servers'
    # bootstrap data and skip verifying its certificate unless told otherwise.
    - name: rke2-etcd-upload
      enabledIf: {{ include "kubehenge.etcdUploadEnabled" . }}
      definitions:
        - selector:
            apiVersion: controlplane.cluster.x-k8s.io/v1beta2
            kind: RKE2ControlPlaneTemplate
            matchResources:
              controlPlane: true
          jsonPatches:
            - op: add
              path: /spec/template/spec/files/-
              valueFrom:
                template: |
                  {{- include "kubehenge.etcdUploadFile" (dict "path" "/etc/rancher/rke2/config.yaml.d/60-kubehenge-etcd-s3.yaml") | nindent 18 }}
    - name: rke2-oidc
      enabledIf: {{ include "kubehenge.oidcEnabled" . }}
      definitions:
        - selector:
            apiVersion: controlplane.cluster.x-k8s.io/v1beta2
            kind: RKE2ControlPlaneTemplate
            matchResources:
              controlPlane: true
          jsonPatches:
            - op: add
              path: /spec/template/spec/files/-
              valueFrom:
                template: |
                  {{- include "kubehenge.oidcFile" (dict "root" . "path" "/etc/rancher/rke2/authentication-config.yaml" "anonymous" false) | nindent 18 }}
            # RKE2 mounts every file an argument names into the API server's static pod; mounting it
            # again as an extra mount makes the pod invalid (a mount path must be unique).
            - op: add
              path: /spec/template/spec/serverConfig/kubeAPIServer/extraArgs/-
              value: authentication-config=/etc/rancher/rke2/authentication-config.yaml
            # RKE2 switches anonymous requests off itself only while it is given no file.
            - op: add
              path: /spec/template/spec/serverConfig/kubeAPIServer/extraArgs/-
              value: anonymous-auth=false
    # RKE2's profile keeps the admission configuration it is given, which enforces restricted
    # under cis already. Under it a server refuses to start without an etcd user and group, whom it
    # gives etcd's data and process.
    - name: rke2-cis
      enabledIf: {{ include "kubehenge.cisEnabled" . }}
      definitions:
        - selector:
            apiVersion: controlplane.cluster.x-k8s.io/v1beta2
            kind: RKE2ControlPlaneTemplate
            matchResources:
              controlPlane: true
          jsonPatches:
            - op: add
              path: /spec/template/spec/preRKE2Commands/-
              value: id -u etcd >/dev/null 2>&1 || useradd --system --user-group --no-create-home --shell /usr/sbin/nologin --comment "etcd user" etcd
        {{- range $kind, $sel := dict "RKE2ControlPlaneTemplate" (dict "selector" (dict "controlPlane" true) "api" "controlplane.cluster.x-k8s.io/v1beta2") "RKE2ConfigTemplate" (dict "selector" (dict "machineDeploymentClass" (dict "names" (list "worker"))) "api" "bootstrap.cluster.x-k8s.io/v1beta2") }}
        - selector:
            apiVersion: {{ $sel.api }}
            kind: {{ $kind }}
            matchResources:
              {{- toYaml $sel.selector | nindent 14 }}
          jsonPatches:
            - op: add
              path: /spec/template/spec/agentConfig/cisProfile
              value: cis
            {{- range fromYamlArray (include "kubehenge.cisKubeletArgs" $) }}
            - op: add
              path: /spec/template/spec/agentConfig/kubelet/extraArgs/-
              value: {{ . }}
            {{- end }}
        {{- end }}
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha2
kind: ProxmoxClusterTemplate
metadata:
  name: {{ $clusterName }}
  namespace: {{ .Release.Namespace }}
spec:
  {{- $clusterSpec | nindent 2 }}
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha2
kind: ProxmoxMachineTemplate
metadata:
  name: {{ $machineName }}
  namespace: {{ .Release.Namespace }}
spec:
  {{- $machineSpec | nindent 2 }}
---
{{ include "kubehenge.classTemplates" (dict "class" $class "namespace" .Release.Namespace "templates" (list
  (dict "apiVersion" "controlplane.cluster.x-k8s.io/v1beta2" "kind" "RKE2ControlPlaneTemplate" "name" $controlPlaneName "spec" $controlPlaneSpec)
  (dict "apiVersion" "bootstrap.cluster.x-k8s.io/v1beta2" "kind" "RKE2ConfigTemplate" "name" $workerName "spec" $workerSpec)
)) }}

{{- define "kubehenge.rke2AgentConfig" -}}
preRKE2Commands:
  - sysctl --system
  - {{ include "kubehenge.runcProfileLoad" . | quote }}
agentConfig:
  # The kubelet refuses to start on kernel settings other than its own (kubehenge.sysctlFile).
  protectKernelDefaults: true
  kubelet:
    extraArgs:
      # capmox names a machine by its VM's SMBIOS UUID, which cloud-init reads as the instance ID.
      - provider-id=proxmox://{{ "{{ ds.meta_data.instance_id }}" }}
      - tls-cipher-suites={{ include "kubehenge.tlsCipherSuites" . }}
  {{- if .controlPlane }}
  {{- include "kubehenge.controlPlaneTaints" . | nindent 2 }}
  # In place of the one RKE2 writes, which enforces nothing.
  podSecurityAdmissionConfigFile: /etc/rancher/rke2/pod-security.yaml
  {{- end }}
{{- end -}}

{{- define "kubehenge.rke2ControlPlaneSpec" -}}
template:
  spec:
    {{- include "kubehenge.rke2AgentConfig" (dict "controlPlane" true) | nindent 4 }}
    files:
      {{- include "kubehenge.sysctlFile" . | nindent 6 }}
      {{- include "kubehenge.runcProfileFile" (dict "distribution" "rke2") | nindent 6 }}
      {{- include "kubehenge.removedServerFile" (dict "distribution" "rke2") | nindent 6 }}
      {{- include "kubehenge.auditPolicyFile" (dict "root" . "path" "/etc/rancher/rke2/audit-policy.yaml") | nindent 6 }}
      # Given a policy, RKE2 audits the API server and keeps a month of the log.
      - path: /etc/rancher/rke2/config.yaml.d/50-kubehenge-audit.yaml
        owner: root:root
        permissions: "0600"
        content: |
          audit-policy-file: /etc/rancher/rke2/audit-policy.yaml
    serverConfig:
      # The Proxmox VE cloud controller manager initialises the nodes instead of RKE2's own.
      cloudProviderName: external
      disableComponents:
        kubernetesComponents: [cloudController]
      kubeAPIServer:
        extraArgs:
          - enable-admission-plugins=NodeRestriction,EventRateLimit
          # Every client reloads its projected token, so none needs it to outlast its hour.
          - service-account-extend-token-expiration=false
          - tls-cipher-suites={{ include "kubehenge.tlsCipherSuites" . }}
      # Served on loopback only, RKE2's own default, with their metrics let through there without
      # credentials, as etcd's and kube-proxy's are: the metrics proxy on the node's address
      # authenticates Prometheus instead.
      kubeControllerManager:
        extraArgs:
          - authorization-always-allow-paths=/healthz,/readyz,/livez,/metrics
          {{- include "kubehenge.patientLeaseArgs" . | nindent 10 }}
      kubeScheduler:
        extraArgs:
          - authorization-always-allow-paths=/healthz,/readyz,/livez,/metrics
          {{- include "kubehenge.patientLeaseArgs" . | nindent 10 }}
    rolloutStrategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 1
{{- end -}}

{{- define "kubehenge.rke2WorkerSpec" -}}
template:
  spec:
    {{- include "kubehenge.rke2AgentConfig" (dict) | nindent 4 }}
    files:
      {{- include "kubehenge.sysctlFile" . | nindent 6 }}
      {{- include "kubehenge.runcProfileFile" (dict "distribution" "rke2") | nindent 6 }}
{{- end -}}
