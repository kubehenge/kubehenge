{{- $name := "kubehenge-controller" }}
{{- $extension := "kubehenge-extension" }}
{{- $tls := printf "%s-tls" $extension }}
{{- $labels := dict "app.kubernetes.io/name" $name "app.kubernetes.io/instance" .Release.Name }}
{{- $chartValues := dict }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}
rules:
  - apiGroups: [cluster.x-k8s.io]
    resources: [clusters]
    verbs: [get, list, watch, patch, update]
  # The condition that tells whether a cluster's last etcd snapshot was taken.
  - apiGroups: [cluster.x-k8s.io]
    resources: [clusters/status]
    verbs: [patch]
  - apiGroups: [cluster.x-k8s.io]
    resources: [clusterclasses]
    verbs: [get, list, watch]
  # With Proxmox VE HA, a pre-terminate hook holds a control-plane Machine's deletion until its VM is
  # out of HA, and marking a ProxmoxMachine has capmox find its VM on the node HA moved it to. Without
  # it, the controller takes back the hooks it set. An etcd restore deletes the control-plane
  # Machines etcd was not restored on, for Cluster API to make again.
  - apiGroups: [cluster.x-k8s.io]
    resources: [machines]
    verbs: [get, list, watch, patch, delete]
  - apiGroups: [infrastructure.cluster.x-k8s.io]
    resources: [proxmoxmachines]
    verbs: [get, list, watch, patch]
  # What a node of each autoscaled pool holds goes onto its MachineDeployment, for the autoscaler.
  - apiGroups: [cluster.x-k8s.io]
    resources: [machinedeployments]
    verbs: [get, list, watch, patch]
  # Each cluster's autoscaler gets the autoscaler role in the cluster's namespace, which can be any;
  # bind lets the controller grant that role and no other.
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [rolebindings]
    verbs: [get, create, update, delete]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterroles]
    resourceNames: [kubehenge-autoscaler]
    verbs: [bind]
  # Each cluster's token and the ClusterResourceSet Secret delivering it live in the cluster's
  # namespace, which can be any. delete: an identity's token goes once the cluster no longer wants
  # the identity, such as the backup ones when backups are switched off.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, create, update, patch, delete]
  # The boot logs of the machines a cluster asks for, <cluster>-boot-logs beside it, which the
  # Cluster owns and takes with it.
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, create, update]
  - apiGroups: [addons.cluster.x-k8s.io]
    resources: [clusterresourcesets]
    verbs: [get, list, watch, create, update, patch]
  # delete: an add-on switched off for a cluster goes with its proxy.
  - apiGroups: [addons.cluster.x-k8s.io]
    resources: [helmchartproxies]
    verbs: [get, list, watch, create, update, patch, delete]
  # What the controller refuses to do for a cluster is reported as an event on it.
  - apiGroups: [events.k8s.io]
    resources: [events]
    verbs: [create, patch]
  # A cluster being deleted is listed for what of it holds the deletion up. Abandoning a deletion,
  # which an administrator asks for on the Cluster, deletes what of the cluster is left and takes
  # the finalizers off what does not finish; the controller already deletes a cluster's machines,
  # and patching its Cluster reaches everything else of it through the topology.
  - apiGroups: [cluster.x-k8s.io]
    resources: [machinedeployments, machinesets, machines]
    verbs: [list, patch, delete]
  - apiGroups: [controlplane.cluster.x-k8s.io]
    resources: [kubeadmcontrolplanes, rke2controlplanes, kthreescontrolplanes, taloscontrolplanes]
    verbs: [list, patch, delete]
  - apiGroups: [bootstrap.cluster.x-k8s.io]
    resources: [kubeadmconfigs, rke2configs, kthreesconfigs, talosconfigs]
    verbs: [list, patch, delete]
  - apiGroups: [infrastructure.cluster.x-k8s.io]
    resources: [proxmoxmachines, proxmoxclusters]
    verbs: [list, patch, delete]
  - apiGroups: [ipam.cluster.x-k8s.io]
    resources: [ipaddressclaims, ipaddresses]
    verbs: [list, patch, delete]
  - apiGroups: [addons.cluster.x-k8s.io]
    resources: [helmreleaseproxies]
    verbs: [list, patch, delete]
  # Marking its own ExtensionConfig has Cluster API rediscover the hooks a new version serves.
  - apiGroups: [runtime.cluster.x-k8s.io]
    resources: [extensionconfigs]
    resourceNames: [kubehenge]
    verbs: [patch]
  # The metrics endpoint asks the API server who calls it and whether they may get /metrics.
  - apiGroups: [authentication.k8s.io]
    resources: [tokenreviews]
    verbs: [create]
  - apiGroups: [authorization.k8s.io]
    resources: [subjectaccessreviews]
    verbs: [create]
---
# Bound to a scraper's account, it lets the scraper read the controller's metrics, and nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubehenge-metrics-reader
rules:
  - nonResourceURLs: [/metrics]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
# The controller writes Secrets in every cluster's namespace, which RBAC cannot narrow to a name. A
# ServiceAccount token Secret it wrote would be filled with a token of any account in that
# namespace, and hand it that account's rights. The controller asks workload clusters for tokens
# through the TokenRequest API and writes no such Secret, so this refuses it every one. It runs
# inside the API server, so no webhook has to answer for it, and it fails closed.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $name }}-secrets
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [secrets]
  matchConditions:
    - name: controller
      expression: request.userInfo.username == 'system:serviceaccount:{{ .Release.Namespace }}:{{ $name }}'
  validations:
    - expression: "!has(object.type) || object.type != 'kubernetes.io/service-account-token'"
      message: the controller writes no ServiceAccount token Secrets
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $name }}-secrets
spec:
  policyName: {{ $name }}-secrets
  validationActions: [Deny]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
  # The ClusterClasses' control-plane and bootstrap templates, applied while a cluster uses their
  # distribution and removed with the last one; touching the class has Cluster API look at it
  # again, as it does not watch templates. The kubeadm class also carries the Kubernetes versions
  # its VM templates exist for, which the interface offers.
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, watch]
  # The checksums of each RKE2 and k3s release a cluster used, recorded once; a create cannot be
  # held to a name.
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [create]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [kubehenge-release-checksums]
    verbs: [update]
  # The HA rules offered to cluster creators, kept current while interface.offerHARules is on and
  # removed when it is switched off.
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [kubehenge-ha-rules]
    verbs: [update, delete]
  - apiGroups: [controlplane.cluster.x-k8s.io]
    resources: [kubeadmcontrolplanetemplates, rke2controlplanetemplates, kthreescontrolplanetemplates, taloscontrolplanetemplates]
    verbs: [create, patch, deletecollection]
  - apiGroups: [bootstrap.cluster.x-k8s.io]
    resources: [kubeadmconfigtemplates, rke2configtemplates, kthreesconfigtemplates, talosconfigtemplates]
    verbs: [create, patch, deletecollection]
  - apiGroups: [cluster.x-k8s.io]
    resources: [clusterclasses]
    resourceNames: {{ keys .Values.providerNamespaces | sortAlpha | toJson }}
    verbs: [patch]
  {{- if .Values.templateRefresh.enabled }}
  # The builds asked for in the interface run as the template refresh CronJob's Job, one at a time:
  # the controller takes the requests and starts that Job, never one of its own making.
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [kubehenge-template-requests]
    verbs: [update, patch]
  - apiGroups: [batch]
    resources: [cronjobs]
    resourceNames: [kubehenge-template-refresh]
    verbs: [get]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [list, create]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
{{- /*
A distribution's providers run only while a cluster uses them. The scale subresource changes a
replica count and nothing else, so this is all the controller may do to them.
*/}}
{{- range $class, $namespaces := .Values.providerNamespaces }}
{{- range $namespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ . }}
rules:
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments/scale]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- toYaml $labels | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- toYaml $labels | nindent 6 }}
  template:
    metadata:
      labels:
        {{- toYaml $labels | nindent 8 }}
    spec:
      serviceAccountName: {{ $name }}
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: {{ required "image: Kubehenge's controller image by digest" .Values.image }}
          args:
            - controller
            - --workload-pool={{ .Values.workloadPool }}
            - --cluster-group={{ .Values.proxmox.clusterGroup }}
            - --cluster-role={{ .Values.proxmox.clusterRole }}
            {{- with .Values.proxmox.volumeOwnerNode }}
            - --volume-owner-node={{ . }}
            {{- end }}
            {{- with .Values.proxmox.region }}
            - --region={{ . }}
            {{- end }}
            {{- with .Values.proxmox.datastoreAllocate.role }}
            - --datastore-allocate-role={{ . }}
            - --management-storages={{ join "," $.Values.proxmox.datastoreAllocate.managementStorages }}
            {{- end }}
            {{- with .Values.proxmox.sysAuditGroup }}
            - --sys-audit-group={{ . }}
            {{- end }}
            - --boot-logs={{ .Values.proxmox.bootLogs }}
            - --csi-proxy-image={{ .Values.image }}
            {{- range $flag, $chart := dict "ccm-chart" .Values.addons.cloudControllerManager "csi-chart" .Values.addons.csiPlugin "csi-newest-chart" .Values.addons.csiPluginNewest "snapshot-controller-chart" .Values.addons.snapshotController "cilium-chart" .Values.addons.cilium "calico-chart" .Values.addons.calico "headlamp-chart" .Values.addons.headlamp "rancher-chart" .Values.addons.rancher "cert-manager-chart" .Values.addons.certManager "monitoring-chart" .Values.addons.monitoring "loki-chart" .Values.addons.loki "alloy-chart" .Values.addons.alloy "velero-chart" .Values.addons.velero "kyverno-chart" .Values.addons.kyverno "kyverno-policies-chart" .Values.addons.kyvernoPolicies "istio-chart" .Values.addons.istio "istio-base-chart" .Values.addons.istioBase "istio-cni-chart" .Values.addons.istioCNI "istio-ztunnel-chart" .Values.addons.istioZtunnel "traefik-chart" .Values.addons.traefik "metallb-chart" .Values.addons.metallb "kube-vip-chart" .Values.addons.kubeVip "kube-vip-cloud-provider-chart" .Values.addons.kubeVipCloudProvider "argocd-chart" .Values.addons.argocd "flux-operator-chart" .Values.addons.fluxOperator }}
            - --{{ $flag }}={{ $chart.repository }}/{{ $chart.chart }}:{{ $chart.version }}
            {{- with $chart.values }}
            {{- $_ := set $chartValues (trimSuffix "-chart" $flag) . }}
            {{- end }}
            {{- end }}
            - {{ printf "--chart-values=%s" (toJson $chartValues) | quote }}
            - --calico-images={{ join "," .Values.addons.calico.images }}
            - --rancher-kubernetes={{ .Values.addons.rancher.kubernetes }}
            - --rancher-turtles-image={{ .Values.addons.rancher.turtles.image }}
            - --rancher-cluster-api-image={{ .Values.addons.rancher.turtles.clusterAPI }}
            - --kube-rbac-proxy-image={{ .Values.addons.monitoring.kubeRBACProxy }}
            - --alloy-image={{ .Values.addons.alloy.image }}
            - --velero-image={{ .Values.addons.velero.image }}
            - --velero-plugin-image={{ .Values.addons.velero.plugin }}
            - --kube-vip-image={{ .Values.kubeVip }}
            - --flux-version={{ .Values.addons.fluxOperator.flux }}
            - --autoscaler-namespace={{ .Values.autoscaler.namespace }}
            - --autoscaler-images={{ join "," .Values.autoscaler.images }}
            {{- with .Values.managementEndpoint }}
            - --management-endpoint={{ . }}
            {{- end }}
            - {{ printf "--pod-security-exempt=%s" (toJson .Values.podSecurityExempt) | quote }}
            - --proxmox-ca=/etc/kubehenge/proxmox/ca.crt
            {{- if .Values.interface.offerHARules }}
            - --offer-ha-rules
            {{- end }}
            - --node-image-soak={{ .Values.templateRefresh.soakHours }}h
            - --stall-after={{ .Values.watch.stallMinutes }}m
            {{- if .Values.templateRefresh.enabled }}
            - --template-refresh
            {{- end }}
            - --proxmox-insecure={{ .Values.proxmox.insecure }}
            {{- if .Values.interface.headlampSignIn }}
            - --headlamp-sign-in-namespaces={{ prepend (.Values.interface.extraNamespaces | default list) .Values.interface.namespace | join "," }}
            {{- end }}
            {{- range $class, $namespaces := .Values.providerNamespaces }}
            - --class-providers={{ $class }}={{ join "," $namespaces }}
            {{- end }}
            - --metrics-address=:8443
            - --log-level={{ .Values.controllerLogs.level }}
            - --log-development={{ .Values.controllerLogs.development }}
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: KUBEHENGE_PROXMOX_URL
              value: {{ required "proxmox.url is required" .Values.proxmox.url | quote }}
            - name: KUBEHENGE_PROXMOX_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.proxmox.secret }}
                  key: token
            {{- if .Values.proxmox.ha }}
            - name: KUBEHENGE_PROXMOX_HA_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.proxmox.secret }}
                  key: ha-token
            {{- end }}
            {{- if .Values.proxmox.etcdRestore }}
            - name: KUBEHENGE_PROXMOX_RESTORE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.proxmox.secret }}
                  key: restore-token
            {{- end }}
          ports:
            - name: extension
              containerPort: 9443
            - name: health
              containerPort: 8081
            - name: metrics
              containerPort: 8443
          # A node that stalls for half a minute, every controller on it busy at once, is no reason
          # to restart the only replica: its webhooks refuse every Cluster while it starts again.
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: proxmox
              mountPath: /etc/kubehenge/proxmox
              readOnly: true
            - name: tls
              mountPath: /etc/kubehenge/tls
              readOnly: true
            - name: scratch
              mountPath: /tmp
      volumes:
        # A Talos control plane recovered from a stalled roll has its etcd copied off before the
        # node is wiped, and the copy outgrows the container's memory; etcd's default quota is 2 GiB.
        - name: scratch
          emptyDir:
            sizeLimit: 3Gi
        - name: proxmox
          secret:
            secretName: {{ .Values.proxmox.secret }}
            items:
              - key: ca.crt
                path: ca.crt
        - name: tls
          secret:
            secretName: {{ $tls }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $extension }}
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    {{- toYaml $labels | nindent 4 }}
  ports:
    - port: 443
      targetPort: extension
---
# The controller's metrics, over HTTPS, for whoever the API server lets get /metrics
# (kubehenge-metrics-reader).
apiVersion: v1
kind: Service
metadata:
  name: kubehenge-controller-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- toYaml $labels | nindent 4 }}
spec:
  selector:
    {{- toYaml $labels | nindent 4 }}
  ports:
    - name: metrics
      port: 8443
      targetPort: metrics
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ $extension }}
  namespace: {{ .Release.Namespace }}
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $extension }}
  namespace: {{ .Release.Namespace }}
spec:
  secretName: {{ $tls }}
  # The controller serves its metrics with it too, which a scraper verifies against its ca.crt.
  dnsNames:
    - {{ $extension }}.{{ .Release.Namespace }}.svc
    - kubehenge-controller-metrics.{{ .Release.Namespace }}.svc
  issuerRef:
    kind: Issuer
    name: {{ $extension }}
---
# Cluster API calls the controller's lifecycle hooks, trusting the CA cert-manager writes into the
# certificate's Secret.
apiVersion: runtime.cluster.x-k8s.io/v1beta2
kind: ExtensionConfig
metadata:
  name: kubehenge
  annotations:
    runtime.cluster.x-k8s.io/inject-ca-from-secret: {{ .Release.Namespace }}/{{ $tls }}
spec:
  clientConfig:
    service:
      name: {{ $extension }}
      namespace: {{ .Release.Namespace }}
      port: 443
---
# The controller checks Kubehenge's clusters as they are created and changed (pkg/provisioner's
# ClusterValidator), among them the grants a cluster asks for, such as Datastore.Allocate on its
# storage. While the controller is away no cluster is created or changed: one let through then
# would keep what the check refuses. Nothing the management cluster needs to come up writes a
# Cluster, and a cluster being deleted, which the check leaves alone, is never held up by it.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: kubehenge
  annotations:
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/{{ $extension }}
webhooks:
  - name: clusters.kubehenge.dev
    admissionReviewVersions: [v1]
    sideEffects: None
    failurePolicy: Fail
    matchConditions:
      - name: not-being-deleted
        expression: "!has(object.metadata.deletionTimestamp)"
    timeoutSeconds: 5
    clientConfig:
      service:
        name: {{ $extension }}
        namespace: {{ .Release.Namespace }}
        path: /validate-cluster
        port: 443
    rules:
      - apiGroups: [cluster.x-k8s.io]
        apiVersions: [v1beta2]
        operations: [CREATE, UPDATE]
        resources: [clusters]
