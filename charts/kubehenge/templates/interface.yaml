{{- /*
The identity Kubehenge's web interface acts with in the management cluster, instead of an admin
kubeconfig: it sees every cluster, but creates, changes and deletes them, reads their
kubeconfigs and stores the credentials users type in for them, only in its own namespace and the
extra ones it is given. What it reads of a cluster beyond the cluster itself (its machines, pools,
control plane, health checks, add-on releases and events) is what the health page shows anyone who
sees the cluster. A cluster's support bundle and its nodes' boot logs, for those who may download
its admin kubeconfig, read every Cluster API object of the cluster and the lines of the
controller's and providers' logs that name them.
*/}}
{{- $name := "kubehenge-interface" }}
{{- $ns := .Values.interface.namespace }}
{{- $extra := .Values.interface.extraNamespaces | default list }}
{{- range $extra }}
{{- if or (eq . $ns) (eq . $.Release.Namespace) (eq . "default") (eq . "cert-manager") (hasPrefix "kube-" .) (hasSuffix "-system" .) }}
{{- fail (printf "interface.extraNamespaces: %s holds Kubernetes', the providers' or Kubehenge's own objects, or is the interface's namespace already" .) }}
{{- end }}
{{- end }}
{{- $namespaces := prepend $extra $ns }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $ns }}
{{- range $extra }}
{{- /* A namespace made before, by anyone but this release, stays its maker's. */}}
{{- $existing := lookup "v1" "Namespace" "" . }}
{{- if or (not $existing) (eq (dig "metadata" "annotations" "meta.helm.sh/release-name" "" $existing) $.Release.Name) }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ . }}
  annotations:
    # Taken out of extraNamespaces, the namespace stays with its clusters; only the interface's
    # rights there go.
    helm.sh/resource-policy: keep
{{- end }}
{{- end }}
---
# Where the interface creates and changes clusters, its own namespace first. It reads this rather
# than a setting of its own, so that its rights and its offer change together. Likewise whether
# the shared Headlamp offers its actions, so that it changes with the release applied.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
data:
  namespaces: {{ toJson $namespaces | quote }}
  {{- if .Values.interface.headlampActions }}
  headlampActions: "true"
  {{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}
rules:
  - apiGroups: [cluster.x-k8s.io]
    resources: [clusters, machines]
    verbs: [get, list, watch]
  - apiGroups: [cluster.x-k8s.io]
    resources: [machinedeployments, machinehealthchecks]
    verbs: [get, list]
  - apiGroups: [controlplane.cluster.x-k8s.io]
    resources: [kubeadmcontrolplanes, rke2controlplanes, kthreescontrolplanes]
    verbs: [get]
  - apiGroups: [addons.cluster.x-k8s.io]
    resources: [helmreleaseproxies]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [events]
    verbs: [list]
  # The management cluster's own health on the Administration page.
  - apiGroups: [""]
    resources: [nodes]
    verbs: [list]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [cluster.x-k8s.io]
    resources: [clusterclasses]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [{{ $name }}]
    verbs: [get]
  # The controller's log, of which a cluster's support bundle carries the lines naming the
  # cluster's objects, for those who may download its admin kubeconfig.
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  # The interface runs outside the cluster with expiring tokens of this account, the first made
  # with the admin kubeconfig at apply, each next one by the interface with the one before. It may
  # make tokens of its own account and no other.
  - apiGroups: [""]
    resources: [serviceaccounts/token]
    resourceNames: [{{ $name }}]
    verbs: [create]
  {{- if .Values.interface.offerHARules }}
  # The HA rules' names and nodes, which it offers to those who may create or change a cluster.
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [kubehenge-ha-rules]
    verbs: [get]
  {{- end }}
  {{- if .Values.templateRefresh.enabled }}
  # The template refresh's schedule and last run, and the requests for builds: an administrator's
  # Build now, and with creatorBuilds a cluster creator's missing template. The controller starts
  # the builds; the interface cannot start a pod.
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [kubehenge-template-refresh, kubehenge-template-requests]
    verbs: [get]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [kubehenge-template-requests]
    verbs: [patch]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
{{- range $namespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ . }}
rules:
  - apiGroups: [cluster.x-k8s.io]
    resources: [clusters]
    verbs: [create, update, patch, delete]
  # Marking a machine for its health check to replace, which the policy below holds it to.
  - apiGroups: [cluster.x-k8s.io]
    resources: [machines]
    verbs: [patch]
  # Each cluster's <name>-kubeconfig, and a Talos cluster's <name>-talosconfig, handed to users with
  # Sys.Modify on its pool, its health identities' tokens, and the credentials users type in, which
  # the policy below holds every write and deletion to.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, create, update, delete]
  # What a cluster's support bundle holds: every object of Cluster API and its providers here,
  # never a Secret, and the boot logs the controller reads into <cluster>-boot-logs.
  - apiGroups:
      - cluster.x-k8s.io
      - infrastructure.cluster.x-k8s.io
      - bootstrap.cluster.x-k8s.io
      - controlplane.cluster.x-k8s.io
      - addons.cluster.x-k8s.io
      - ipam.cluster.x-k8s.io
    resources: ["*"]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- /*
The logs of capmox and the Add-on Provider for Helm, of which a cluster's support bundle carries the
lines naming the cluster's objects.
*/}}
{{- range list "proxmox-infrastructure-system" "helm-addon-system" }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}-logs
  namespace: {{ . }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}-logs
  namespace: {{ . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}-logs
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- /*
RBAC cannot tell one Secret from another on create, so this policy holds the interface's writes
and deletions of Secrets to the user credentials it stores (pkg/provisioner's credentialPurposes,
whose purposes and scopes this follows): labelled with their purpose, of their own type, named for
their cluster and purpose, and never another Secret, such as a cluster's kubeconfig, CA or
Proxmox VE token. It runs inside the API server, so no webhook has to answer for it, and it fails
closed.
*/}}
{{- $credential := "kubehenge.dev/user-credential" }}
{{- $credentialCluster := "kubehenge.dev/credential-cluster" }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $name }}-credentials
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE, DELETE]
        resources: [secrets]
  matchConditions:
    - name: interface
      expression: request.userInfo.username == 'system:serviceaccount:{{ .Release.Namespace }}:{{ $name }}'
  variables:
    # The Secret as the request leaves it, or the one it deletes.
    - name: secret
      expression: "request.operation == 'DELETE' ? oldObject : object"
    - name: purpose
      expression: >-
        has(variables.secret.metadata.labels) && '{{ $credential }}' in variables.secret.metadata.labels
        ? variables.secret.metadata.labels['{{ $credential }}'] : ''
    - name: cluster
      expression: >-
        has(variables.secret.metadata.labels) && '{{ $credentialCluster }}' in variables.secret.metadata.labels
        ? variables.secret.metadata.labels['{{ $credentialCluster }}'] : ''
  validations:
    - expression: >-
        request.operation != 'UPDATE'
        || (has(oldObject.metadata.labels) && '{{ $credential }}' in oldObject.metadata.labels)
      message: the interface changes no Secret but the credentials it stores
    - expression: >-
        variables.cluster == ''
        ? variables.purpose in ['backup', 'dns01']
        : variables.purpose in ['backup', 'dns01', 'gitops', 'oidc-client']
      messageExpression: >-
        'the interface writes and deletes only credentials labelled {{ $credential }} with a purpose it knows, not '
        + (variables.purpose == '' ? 'an unlabelled Secret' : 'one for ' + variables.purpose)
    - expression: has(variables.secret.type) && variables.secret.type == '{{ $credential }}'
      message: a credential is of type {{ $credential }}
    - expression: >-
        variables.secret.metadata.name == (variables.cluster == ''
        ? 'kubehenge-' + variables.purpose : variables.cluster + '.' + variables.purpose)
      message: a credential is named <cluster>.<purpose>, or kubehenge-<purpose> for every cluster
    - expression: >-
        request.operation == 'DELETE' || !has(variables.secret.metadata.finalizers)
        || size(variables.secret.metadata.finalizers) == 0
      message: a credential carries no finalizers
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $name }}-credentials
spec:
  policyName: {{ $name }}-credentials
  validationActions: [Deny]
{{- /*
RBAC cannot narrow a patch to one annotation, so this policy holds the interface's changes to
Machines to Cluster API's remediation mark, which a cluster's health check acts on as on a node that
stays not ready: setting it or taking it back, and nothing else of the Machine.
*/}}
{{- $mark := "cluster.x-k8s.io/remediate-machine" }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $name }}-machines
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [cluster.x-k8s.io]
        apiVersions: ["*"]
        operations: [UPDATE]
        resources: [machines]
  matchConditions:
    - name: interface
      expression: request.userInfo.username == 'system:serviceaccount:{{ .Release.Namespace }}:{{ $name }}'
  validations:
    - expression: >-
        object.spec == oldObject.spec
        && has(object.metadata.labels) == has(oldObject.metadata.labels)
        && (!has(object.metadata.labels) || object.metadata.labels == oldObject.metadata.labels)
        && has(object.metadata.finalizers) == has(oldObject.metadata.finalizers)
        && (!has(object.metadata.finalizers) || object.metadata.finalizers == oldObject.metadata.finalizers)
        && has(object.metadata.ownerReferences) == has(oldObject.metadata.ownerReferences)
        && (!has(object.metadata.ownerReferences) || object.metadata.ownerReferences == oldObject.metadata.ownerReferences)
      message: the interface changes nothing of a Machine but the {{ $mark }} annotation
    - expression: >-
        (!has(object.metadata.annotations) || object.metadata.annotations.all(k, k == '{{ $mark }}'
        || (has(oldObject.metadata.annotations) && k in oldObject.metadata.annotations
        && oldObject.metadata.annotations[k] == object.metadata.annotations[k])))
        && (!has(oldObject.metadata.annotations) || oldObject.metadata.annotations.all(k, k == '{{ $mark }}'
        || (has(object.metadata.annotations) && k in object.metadata.annotations)))
      message: the interface changes nothing of a Machine but the {{ $mark }} annotation
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $name }}-machines
spec:
  policyName: {{ $name }}-machines
  validationActions: [Deny]
