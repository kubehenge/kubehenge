{{- $class := "kubehenge-kubeadm" }}
{{- $clusterSpec := include "kubehenge.proxmoxClusterSpec" . }}
{{- /* Placeholder tags: the controller's patch selects the build of each machine's version's template. */}}
{{- $machineSpec := include "kubehenge.proxmoxMachineSpec" (dict "tags" (list "kubeadm" "kubehenge" "os-almalinux-10")) }}
{{- $controlPlaneSpec := include "kubehenge.kubeadmControlPlaneSpec" . }}
{{- $workerSpec := include "kubehenge.kubeadmWorkerSpec" . }}
{{- $clusterName := include "kubehenge.hashedName" (dict "name" $class "spec" $clusterSpec) }}
{{- $machineName := include "kubehenge.hashedName" (dict "name" (printf "%s-machine" $class) "spec" $machineSpec) }}
{{- $controlPlaneName := include "kubehenge.hashedName" (dict "name" (printf "%s-control-plane" $class) "spec" $controlPlaneSpec) }}
{{- $workerName := include "kubehenge.hashedName" (dict "name" (printf "%s-worker" $class) "spec" $workerSpec) }}
apiVersion: cluster.x-k8s.io/v1beta2
kind: ClusterClass
metadata:
  name: {{ $class }}
  namespace: {{ .Release.Namespace }}
  annotations:
    # kubeadm brings no CNI: Kubehenge's controller installs the one the cni variable names.
    kubehenge.dev/cni: cilium,calico
    # kubeadm's own service range, and the pod range the controller gives the CNI, for a Cluster
    # that sets none.
    kubehenge.dev/default-pods: 10.244.0.0/16
    kubehenge.dev/default-services: 10.96.0.0/12
    # kubeadm documents no sizes, so its control planes follow RKE2's server sizing guide: the least
    # vCPUs and memory from a number of workers.
    kubehenge.dev/control-plane-sizes: '[{"workers":0,"cores":2,"memoryMiB":4096},{"workers":226,"cores":4,"memoryMiB":8192},{"workers":451,"cores":8,"memoryMiB":16384},{"workers":1301,"cores":16,"memoryMiB":32768}]'
    {{- include "kubehenge.addonMemory" . | nindent 4 }}
    {{- include "kubehenge.addonControlPlaneMemory" . | nindent 4 }}
    {{- include "kubehenge.backupTargets" . | nindent 4 }}
    # What a node uses before any add-on, measured by the end-to-end tests: a control plane with a
    # quarter on top, which the kernel's caches and the API server's peaks take; a worker with a tenth.
    kubehenge.dev/node-memory: '{"controlPlane":3376,"worker":704}'
    # What Calico adds to a control plane in place of Cilium, which node-memory's figure runs: the most
    # an idle control plane used with it in the end-to-end tests, less the least with Cilium at the
    # same size, with a quarter on top, in steps of 8.
    kubehenge.dev/cni-control-plane-memory: '{"calico":1424}'
    {{- include "kubehenge.addonCPU" . | nindent 4 }}
    # The CPU, in millicores, a node's own pods request besides the add-ons': on a worker the CNI's
    # agent (Cilium's 100m, what its CNI installer asks for before the agent's 50m, and its Envoy's
    # 10m; Calico's 50m), Traefik's 10m and the CSI plugin's 30m. The workers together carry
    # CoreDNS's two replicas at 100m each, which can both land on one worker. A control plane
    # without workers runs all of that and adds the API server's 250m, the controller manager's
    # 200m, the scheduler's and etcd's 100m each, the CSI controller's 50m, and 10m each for the
    # cloud controller manager, kube-vip and Cilium's operator, more with Cilium's agent than
    # Calico's operator, Typha, controllers and API server come to. kube-proxy asks for none.
    kubehenge.dev/node-cpu: '{"controlPlane":1080,"worker":150,"workers":200}'
    {{- include "kubehenge.addonMemoryRequests" . | nindent 4 }}
    # The memory, in MiB, a node keeps from the add-ons' requests, counted as node-cpu counts CPU. On
    # a worker the kernel's 104 of a 2 GiB VM, as Talos's measured, the kubelet's 100 eviction
    # threshold (kubeadm reserves nothing else), Cilium's agent at 128 with its Envoy's 64, more than
    # Calico's agent, Traefik's 64 and the CSI plugin's 64. The workers together carry CoreDNS's two
    # replicas at 70 each. A control plane without workers keeps back the kernel's 198 of 4096 MiB,
    # runs all of that and adds etcd's 100, the CSI controller's 80, the cloud controller manager's
    # and kube-vip's 32 each, Cilium's operator's 64, and the 160 by which Calico's agent, operator,
    # Typha, controllers and API server ask for more than Cilium's. The API server, controller
    # manager and scheduler ask for no memory.
    kubehenge.dev/node-memory-requests: '{"controlPlane":1232,"worker":528,"workers":140}'
    {{- if .Values.proxmox.ha }}
    # Tells the interface to offer the proxmoxHA variable: an administrator switched Proxmox VE HA on.
    kubehenge.dev/proxmox-ha: "true"
    {{- end }}
    {{- if .Values.proxmox.datastoreAllocate.role }}
    # Tells the interface to offer the csi variable's datastoreAllocate, on the storages the
    # management cluster does not use: an administrator let clusters choose it.
    kubehenge.dev/datastore-allocate: "true"
    kubehenge.dev/management-storages: {{ join "," .Values.proxmox.datastoreAllocate.managementStorages | quote }}
    {{- end }}
    {{- if .Values.proxmox.sysAuditGroup }}
    # Tells the interface to offer the ccm variable's haGroups: an administrator let clusters hold
    # Sys.Audit on /.
    kubehenge.dev/sys-audit: "true"
    {{- end }}
    {{- include "kubehenge.etcdRestore" . | nindent 4 }}
spec:
  infrastructure:
    templateRef:
      apiVersion: infrastructure.cluster.x-k8s.io/v1alpha2
      kind: ProxmoxClusterTemplate
      name: {{ $clusterName }}
  controlPlane:
    templateRef:
      apiVersion: controlplane.cluster.x-k8s.io/v1beta2
      kind: KubeadmControlPlaneTemplate
      name: {{ $controlPlaneName }}
    machineInfrastructure:
      templateRef:
        apiVersion: infrastructure.cluster.x-k8s.io/v1alpha2
        kind: ProxmoxMachineTemplate
        name: {{ $machineName }}
    naming:
      template: {{ "{{ .cluster.name }}-control-plane-{{ .random }}" | quote }}
    healthCheck:
      {{- include "kubehenge.healthCheck" "controlPlane" | nindent 6 }}
    deletion:
      {{- include "kubehenge.machineDeletion" . | nindent 6 }}
  workers:
    machineDeployments:
      - class: worker
        naming:
          template: {{ "{{ .cluster.name }}-{{ .machineDeployment.topologyName }}-{{ .random }}" | quote }}
        bootstrap:
          templateRef:
            apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
            kind: KubeadmConfigTemplate
            name: {{ $workerName }}
        infrastructure:
          templateRef:
            apiVersion: infrastructure.cluster.x-k8s.io/v1alpha2
            kind: ProxmoxMachineTemplate
            name: {{ $machineName }}
        healthCheck:
          {{- include "kubehenge.healthCheck" "workers" | nindent 10 }}
        deletion:
          {{- include "kubehenge.machineDeletion" . | nindent 10 }}
  variables:
    # A control plane's default memory is node-memory's controlPlane with Calico's figure on top.
    {{- include "kubehenge.proxmoxVariables" (dict "controlPlaneDiskGiB" 30 "controlPlaneMemoryMiB" 4800 "workerDiskGiB" 40 "minDiskGiB" 20 "workerMinCores" 1 "workerMinMemoryMiB" 2048 "clusters" .Values.clusters "sysAudit" (not (empty .Values.proxmox.sysAuditGroup))) | nindent 4 }}
    {{- include "kubehenge.addonVariables" . | nindent 4 }}
    {{- include "kubehenge.upgradeVariables" . | nindent 4 }}
    {{- include "kubehenge.nodeOSVariable" (dict "Files" .Files "noFIPS" "kubeadm") | nindent 4 }}
    {{- include "kubehenge.autoscalerVariable" . | nindent 4 }}
    {{- include "kubehenge.oidcVariable" . | nindent 4 }}
    {{- include "kubehenge.cisVariable" . | nindent 4 }}
    {{- include "kubehenge.etcdVariable" . | nindent 4 }}
    {{- include "kubehenge.workerNodesVariable" . | nindent 4 }}
    {{- include "kubehenge.nodeCustomisationVariable" . | nindent 4 }}
    {{- include "kubehenge.nodeSiteVariables" (dict) | nindent 4 }}
    - name: cni
      required: true
      schema:
        openAPIV3Schema:
          type: string
          description: The CNI plugin, fixed once the cluster exists. kubeadm has none of its own, so one is chosen for every cluster.
          enum: [cilium, calico]
          {{- include "kubehenge.cniFixed" . | nindent 10 }}
  patches:
    {{- include "kubehenge.proxmoxPatches" . | nindent 4 }}
    {{- include "kubehenge.workerNodesPatches" "kubeadm" | nindent 4 }}
    {{- include "kubehenge.clockPatches" "kubeadm" | nindent 4 }}
    - name: kubeadm-control-plane
      definitions:
        - selector:
            apiVersion: controlplane.cluster.x-k8s.io/v1beta2
            kind: KubeadmControlPlaneTemplate
            matchResources:
              controlPlane: true
          jsonPatches:
            - op: add
              path: /spec/template/spec/kubeadmConfigSpec/files/-
              valueFrom:
                template: |
                  {{- include "kubehenge.kubeVipFile" (dict "root" . "path" "/etc/kubernetes/manifests/kube-vip.yaml" "kubeconfig" "/etc/kubernetes/admin.conf") | nindent 18 }}
            - op: add
              path: /spec/template/spec/kubeadmConfigSpec/files/-
              valueFrom:
                template: |
                  {{- include "kubehenge.admissionFile" (dict "root" . "path" "/etc/kubernetes/admission-config.yaml") | nindent 18 }}
            - op: add
              path: /spec/template/spec/kubeadmConfigSpec/files/-
              valueFrom:
                template: |
                  {{- include "kubehenge.oidcFile" (dict "root" . "path" "/etc/kubernetes/authentication-config.yaml" "anonymous" true) | nindent 18 }}
            # The key that encrypts Secrets in etcd, which Kubehenge's controller makes once for the
            # cluster: every control-plane node has to hold the same one.
            - op: add
              path: /spec/template/spec/kubeadmConfigSpec/files/-
              valueFrom:
                template: |
                  path: /etc/kubernetes/encryption-config.yaml
                  owner: root:root
                  permissions: "0600"
                  contentFrom:
                    secret:
                      name: {{ "{{ .builtin.cluster.name }}" }}-encryption
                      key: encryption-config.yaml
            - op: add
              path: /spec/template/spec/kubeadmConfigSpec/clusterConfiguration/apiServer/extraEnvs
              valueFrom:
                template: |
                  - name: GOMEMLIMIT
                    value: {{ include "kubehenge.apiServerMemoryLimit" (dict "share" 40) }}
    - name: kubeadm-etcd
      definitions:
        - selector:
            apiVersion: controlplane.cluster.x-k8s.io/v1beta2
            kind: KubeadmControlPlaneTemplate
            matchResources:
              controlPlane: true
          jsonPatches:
            - op: add
              path: /spec/template/spec/kubeadmConfigSpec/clusterConfiguration/etcd
              valueFrom:
                template: |
                  local:
                    extraArgs:
                      - name: quota-backend-bytes
                        value: "{{ include "kubehenge.etcdQuotaBytes" . }}"
                      - name: auto-compaction-mode
                        value: periodic
                      - name: auto-compaction-retention
                        value: 1h
    # kubeadm applies its patches for a target in the order of their names, this one after the
    # kubelet's own (kubehenge.kubeletConfigFile).
    - name: kubeadm-cis
      enabledIf: {{ include "kubehenge.cisEnabled" . }}
      definitions:
        {{- range $kind, $sel := dict "KubeadmControlPlaneTemplate" (dict "selector" (dict "controlPlane" true) "api" "controlplane.cluster.x-k8s.io/v1beta2" "files" "/spec/template/spec/kubeadmConfigSpec/files/-") "KubeadmConfigTemplate" (dict "selector" (dict "machineDeploymentClass" (dict "names" (list "worker"))) "api" "bootstrap.cluster.x-k8s.io/v1beta2" "files" "/spec/template/spec/files/-") }}
        - selector:
            apiVersion: {{ $sel.api }}
            kind: {{ $kind }}
            matchResources:
              {{- toYaml $sel.selector | nindent 14 }}
          jsonPatches:
            - op: add
              path: {{ $sel.files }}
              value:
                path: /etc/kubernetes/patches/kubeletconfiguration1+merge.yaml
                owner: root:root
                permissions: "0600"
                content: |
                  seccompDefault: true
                  streamingConnectionIdleTimeout: 5m
        {{- end }}
    {{- include "kubehenge.searchDomainsPatch" (dict "distribution" "kubeadm") | nindent 4 }}
    {{- include "kubehenge.nodeIPPatch" (dict "distribution" "kubeadm" "root" .) | nindent 4 }}
    {{- include "kubehenge.nodeSitePatches" (dict "root" . "distribution" "kubeadm" "pods" "10.244.0.0/16" "services" "10.96.0.0/12") | nindent 4 }}
    # Last, so that Kubehenge's own settings come first.
    {{- include "kubehenge.nodeCustomisationPatches" "kubeadm" | nindent 4 }}
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha2
kind: ProxmoxClusterTemplate
metadata:
  name: {{ $clusterName }}
  namespace: {{ .Release.Namespace }}
spec:
  {{- $clusterSpec | nindent 2 }}
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha2
kind: ProxmoxMachineTemplate
metadata:
  name: {{ $machineName }}
  namespace: {{ .Release.Namespace }}
spec:
  {{- $machineSpec | nindent 2 }}
---
{{ include "kubehenge.classTemplates" (dict "class" $class "namespace" .Release.Namespace "templates" (list
  (dict "apiVersion" "controlplane.cluster.x-k8s.io/v1beta2" "kind" "KubeadmControlPlaneTemplate" "name" $controlPlaneName "spec" $controlPlaneSpec)
  (dict "apiVersion" "bootstrap.cluster.x-k8s.io/v1beta2" "kind" "KubeadmConfigTemplate" "name" $workerName "spec" $workerSpec)
)) }}

{{/*
A node's registration, called with "controlPlane" or "worker". kubeadm's own control-plane taint
is off: the kubelet registers a control plane with it (kubehenge.kubeadmControlPlaneTaintFile), and
the controller takes it off while the cluster has no worker. Left to kubeadm, the taint is one the
control-plane provider requires, and it holds a control plane not ready for as long as the taint is
off, minutes past its return.
*/}}
{{- define "kubehenge.kubeadmNodeRegistration" -}}
nodeRegistration:
  {{- if eq . "controlPlane" }}
  taints: []
  {{- end }}
  kubeletExtraArgs:
    # The Proxmox VE cloud controller manager initialises the nodes.
    - name: cloud-provider
      value: external
    # capmox names a machine by its VM's SMBIOS UUID, which cloud-init reads as the instance ID.
    - name: provider-id
      value: proxmox://{{ "{{ ds.meta_data.instance_id }}" }}
patches:
  directory: /etc/kubernetes/patches
{{- end -}}

{{/*
The kubelet asks the cluster CA for its serving certificate, which Kubehenge's controller approves
for the node's own name and addresses, instead of serving one it signs itself that nothing can
verify: the API server checks it when it reaches the kubelet, and so does Prometheus. It refuses to
start on kernel settings other than its own (kubehenge.sysctlFile), and offers only strong ciphers.
*/}}
{{- define "kubehenge.kubeletConfigFile" -}}
- path: /etc/kubernetes/patches/kubeletconfiguration+merge.yaml
  owner: root:root
  permissions: "0600"
  content: |
    serverTLSBootstrap: true
    protectKernelDefaults: true
    tlsCipherSuites: [{{ include "kubehenge.tlsCipherSuites" . }}]
{{- end -}}

{{/*
A control plane registers with the control-plane taint, so it takes no workloads before the
controller has looked at it. kubeadm applies its patches for a target in the order of their names,
this one after the kubelet's own and before the CIS benchmark's.
*/}}
{{- define "kubehenge.kubeadmControlPlaneTaintFile" -}}
- path: /etc/kubernetes/patches/kubeletconfiguration0+merge.yaml
  owner: root:root
  permissions: "0600"
  content: |
    registerWithTaints:
      - key: node-role.kubernetes.io/control-plane
        effect: NoSchedule
{{- end -}}

{{/*
kubeadm's controller manager and scheduler serve a certificate they sign themselves, anew on every
start, so nothing can verify them. These come from the cluster CA and name loopback, where the
metrics proxies reach them. They are for serving only: the API server takes a certificate of the
cluster CA from a client only for client authentication. They last as long as kubeadm's own, and
a machine is replaced before either ends.
*/}}
{{- define "kubehenge.kubeadmServingFile" -}}
- path: /etc/kubehenge/serving-certs.sh
  owner: root:root
  permissions: "0700"
  content: |
    #!/bin/sh
    set -eu
    dir=/etc/kubernetes/serving
    mkdir -p -m 0700 "$dir"
    for c in kube-controller-manager kube-scheduler; do
        cat > "$dir/$c.cnf" <<EOF
    [req]
    distinguished_name = dn
    x509_extensions = ext
    prompt = no
    [dn]
    CN = $c
    [ext]
    basicConstraints = critical, CA:FALSE
    keyUsage = critical, digitalSignature
    extendedKeyUsage = serverAuth
    subjectAltName = DNS:localhost, IP:127.0.0.1
    EOF
        openssl req -x509 -new -noenc -newkey ec -pkeyopt ec_paramgen_curve:P-256 -days 365 \
            -CA /etc/kubernetes/pki/ca.crt -CAkey /etc/kubernetes/pki/ca.key \
            -config "$dir/$c.cnf" -keyout "$dir/$c.key" -out "$dir/$c.crt"
    done
{{- end -}}

{{/*
A control-plane component's serving certificate. It serves on loopback only, kubeadm's own
default, and lets its metrics through there without credentials, as etcd and kube-proxy do: the
metrics proxy on the node's address authenticates Prometheus instead. Its leader election is the
patient one (kubehenge.patientLeaseArgs).
*/}}
{{- define "kubehenge.kubeadmServing" -}}
extraArgs:
  - name: authorization-always-allow-paths
    value: /healthz,/readyz,/livez,/metrics
  - name: profiling
    value: "false"
  - name: tls-cert-file
    value: /etc/kubernetes/serving/{{ . }}.crt
  - name: tls-private-key-file
    value: /etc/kubernetes/serving/{{ . }}.key
  {{- range $arg := fromYamlArray (include "kubehenge.patientLeaseArgs" $) }}
  - name: {{ (splitn "=" 2 $arg)._0 }}
    value: {{ (splitn "=" 2 $arg)._1 }}
  {{- end }}
extraVolumes:
  {{- range $ext := list "crt" "key" }}
  - name: serving-{{ $ext }}
    hostPath: /etc/kubernetes/serving/{{ $ }}.{{ $ext }}
    mountPath: /etc/kubernetes/serving/{{ $ }}.{{ $ext }}
    readOnly: true
    pathType: File
  {{- end }}
{{- end -}}

{{/*
The kubelet's node IPs. RKE2 and k3s pass the address of the default route's interface where the
cluster is IPv4 alone; kubeadm leaves it to the node, so it is found the same way before kubeadm
runs, without it kubeadm's etcd checks fail too (files/node-ip.sh).
*/}}
{{- define "kubehenge.kubeadmNodeIPFile" -}}
- {{- include "kubehenge.nodeIPFile" . | nindent 2 }}
{{- end -}}

{{- define "kubehenge.kubeadmControlPlaneSpec" -}}
template:
  spec:
    # kubeadm's certificates last a year and are renewed only on a new machine. Kubehenge's
    # certificate watch counts on the same 60 days (CertificateRenewWithin).
    rollout:
      before:
        certificatesExpiryDays: 60
    kubeadmConfigSpec:
      clusterConfiguration:
        apiServer:
          extraArgs:
            - name: kubelet-certificate-authority
              value: /etc/kubernetes/pki/ca.crt
            - name: admission-control-config-file
              value: /etc/kubernetes/admission-config.yaml
            - name: enable-admission-plugins
              value: NodeRestriction,EventRateLimit
            - name: authentication-config
              value: /etc/kubernetes/authentication-config.yaml
            - name: encryption-provider-config
              value: /etc/kubernetes/encryption-config.yaml
            - name: audit-policy-file
              value: /etc/kubernetes/audit-policy.yaml
            - name: audit-log-path
              value: /var/log/kubernetes/audit/audit.log
            # A month of it, in at most a gigabyte, as RKE2 keeps its own.
            - name: audit-log-maxage
              value: "30"
            - name: audit-log-maxbackup
              value: "10"
            - name: audit-log-maxsize
              value: "100"
            # Every client reloads its projected token, so none needs it to outlast its hour.
            - name: service-account-extend-token-expiration
              value: "false"
            - name: profiling
              value: "false"
            - name: tls-cipher-suites
              value: {{ include "kubehenge.tlsCipherSuites" . }}
          extraVolumes:
            {{- range $file := list "admission-config" "authentication-config" "encryption-config" "audit-policy" }}
            - name: {{ $file }}
              hostPath: /etc/kubernetes/{{ $file }}.yaml
              mountPath: /etc/kubernetes/{{ $file }}.yaml
              readOnly: true
              pathType: File
            {{- end }}
            - name: audit-log
              hostPath: /var/log/kubernetes/audit
              mountPath: /var/log/kubernetes/audit
              pathType: DirectoryOrCreate
        controllerManager:
          {{- include "kubehenge.kubeadmServing" "kube-controller-manager" | nindent 10 }}
        scheduler:
          {{- include "kubehenge.kubeadmServing" "kube-scheduler" | nindent 10 }}
      initConfiguration:
        {{- include "kubehenge.kubeadmNodeRegistration" "controlPlane" | nindent 8 }}
      joinConfiguration:
        {{- include "kubehenge.kubeadmNodeRegistration" "controlPlane" | nindent 8 }}
      files:
        # On the first node kube-vip runs on super-admin.conf while kubeadm init does, admin.conf
        # after (files/kube-vip-credentials.sh).
        - path: /etc/kubehenge/kube-vip-credentials.sh
          owner: root:root
          permissions: "0700"
          content: |
            {{- .Files.Get "files/kube-vip-credentials.sh" | nindent 12 }}
        {{- include "kubehenge.kubeadmNodeIPFile" . | nindent 8 }}
        {{- include "kubehenge.kubeletConfigFile" . | nindent 8 }}
        {{- include "kubehenge.kubeadmControlPlaneTaintFile" . | nindent 8 }}
        {{- include "kubehenge.kubeadmServingFile" . | nindent 8 }}
        {{- include "kubehenge.sysctlFile" . | nindent 8 }}
        {{- include "kubehenge.clockFile" . | nindent 8 }}
        {{- include "kubehenge.auditPolicyFile" (dict "root" . "path" "/etc/kubernetes/audit-policy.yaml") | nindent 8 }}
      preKubeadmCommands:
        - {{ include "kubehenge.clockCommand" . }}
        - sysctl --system
        - /etc/kubehenge/node-ip.sh kubeadm
        - /etc/kubehenge/serving-certs.sh
        - /etc/kubehenge/kube-vip-credentials.sh init
      postKubeadmCommands:
        - /etc/kubehenge/kube-vip-credentials.sh done
        {{- include "kubehenge.kubeletFileModes" . | nindent 8 }}
{{- end -}}

{{/*
kubeadm writes the kubelet's configuration readable by every user, where the CIS benchmark asks for
root alone. It holds no secret; the kubelet only reads it at start. The kubelet's service files are
in the node's read-only /usr, where the template already has them root's alone.
*/}}
{{- define "kubehenge.kubeletFileModes" -}}
- chmod 0600 /var/lib/kubelet/config.yaml
{{- end -}}

{{- define "kubehenge.kubeadmWorkerSpec" -}}
template:
  spec:
    joinConfiguration:
      {{- include "kubehenge.kubeadmNodeRegistration" "worker" | nindent 6 }}
    files:
      {{- include "kubehenge.kubeadmNodeIPFile" . | nindent 6 }}
      {{- include "kubehenge.kubeletConfigFile" . | nindent 6 }}
      {{- include "kubehenge.sysctlFile" . | nindent 6 }}
      {{- include "kubehenge.clockFile" . | nindent 6 }}
    preKubeadmCommands:
      - {{ include "kubehenge.clockCommand" . }}
      - sysctl --system
      - /etc/kubehenge/node-ip.sh kubeadm
    postKubeadmCommands:
      {{- include "kubehenge.kubeletFileModes" . | nindent 6 }}
{{- end -}}
