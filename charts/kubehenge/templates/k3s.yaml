{{- $class := "kubehenge-k3s" }}
{{- $clusterSpec := include "kubehenge.proxmoxClusterSpec" . }}
{{- $machineSpec := include "kubehenge.proxmoxMachineSpec" (dict "tags" (list "cloud-image" "kubehenge" "ubuntu-26.04") "serviceJoins" true) }}
{{- $controlPlaneSpec := include "kubehenge.k3sControlPlaneSpec" . }}
{{- $workerSpec := include "kubehenge.k3sWorkerSpec" . }}
{{- $clusterName := include "kubehenge.hashedName" (dict "name" $class "spec" $clusterSpec) }}
{{- $machineName := include "kubehenge.hashedName" (dict "name" (printf "%s-machine" $class) "spec" $machineSpec) }}
{{- $controlPlaneName := include "kubehenge.hashedName" (dict "name" (printf "%s-control-plane" $class) "spec" $controlPlaneSpec) }}
{{- $workerName := include "kubehenge.hashedName" (dict "name" (printf "%s-worker" $class) "spec" $workerSpec) }}
apiVersion: cluster.x-k8s.io/v1beta2
kind: ClusterClass
metadata:
  name: {{ $class }}
  namespace: {{ .Release.Namespace }}
  annotations:
    # k3s brings flannel; Kubehenge's controller installs the others the cni variable names.
    kubehenge.dev/cni: cilium,calico
    # k3s's servicelb forwards packets inside its pods, which Calico allows only when told.
    kubehenge.dev/cni-container-forwarding: "true"
    # k3s's own ranges, for a Cluster that sets none.
    kubehenge.dev/default-pods: 10.42.0.0/16
    kubehenge.dev/default-services: 10.43.0.0/16
    # k3s's server sizing guide: the control planes' least vCPUs and memory from a number of workers.
    kubehenge.dev/control-plane-sizes: '[{"workers":0,"cores":2,"memoryMiB":4096},{"workers":351,"cores":4,"memoryMiB":8192},{"workers":901,"cores":8,"memoryMiB":16384},{"workers":1801,"cores":16,"memoryMiB":32768}]'
    {{- include "kubehenge.addonMemory" . | nindent 4 }}
    {{- include "kubehenge.addonControlPlaneMemory" . | nindent 4 }}
    {{- include "kubehenge.backupTargets" . | nindent 4 }}
    # What a node uses before any add-on, measured by the end-to-end tests: a control plane with a
    # quarter on top, which the kernel's caches and the API server's peaks take; a worker with a tenth.
    kubehenge.dev/node-memory: '{"controlPlane":1856,"worker":448}'
    {{- if .Values.proxmox.ha }}
    # Tells the interface to offer the proxmoxHA variable: an administrator switched Proxmox VE HA on.
    kubehenge.dev/proxmox-ha: "true"
    {{- end }}
    {{- if .Values.proxmox.datastoreAllocate.role }}
    # Tells the interface to offer the csi variable's datastoreAllocate, on the storages the
    # management cluster does not use: an administrator let clusters choose it.
    kubehenge.dev/datastore-allocate: "true"
    kubehenge.dev/management-storages: {{ join "," .Values.proxmox.datastoreAllocate.managementStorages | quote }}
    {{- end }}
    {{- if .Values.proxmox.sysAuditGroup }}
    # Tells the interface to offer the ccm variable's haGroups: an administrator let clusters hold
    # Sys.Audit on /.
    kubehenge.dev/sys-audit: "true"
    {{- end }}
    {{- if .Values.proxmox.volumeSnapshots.rootSecret }}
    # Tells the interface to offer the csi variable's volumeSnapshots: an administrator stored
    # root@pam's password for it.
    kubehenge.dev/volume-snapshots: "true"
    {{- end }}
spec:
  infrastructure:
    templateRef:
      apiVersion: infrastructure.cluster.x-k8s.io/v1alpha2
      kind: ProxmoxClusterTemplate
      name: {{ $clusterName }}
  controlPlane:
    templateRef:
      apiVersion: controlplane.cluster.x-k8s.io/v1beta2
      kind: KThreesControlPlaneTemplate
      name: {{ $controlPlaneName }}
    machineInfrastructure:
      templateRef:
        apiVersion: infrastructure.cluster.x-k8s.io/v1alpha2
        kind: ProxmoxMachineTemplate
        name: {{ $machineName }}
    naming:
      template: {{ "{{ .cluster.name }}-control-plane-{{ .random }}" | quote }}
    healthCheck:
      {{- include "kubehenge.healthCheck" "controlPlane" | nindent 6 }}
  workers:
    machineDeployments:
      - class: worker
        naming:
          template: {{ "{{ .cluster.name }}-{{ .machineDeployment.topologyName }}-{{ .random }}" | quote }}
        bootstrap:
          templateRef:
            apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
            kind: KThreesConfigTemplate
            name: {{ $workerName }}
        infrastructure:
          templateRef:
            apiVersion: infrastructure.cluster.x-k8s.io/v1alpha2
            kind: ProxmoxMachineTemplate
            name: {{ $machineName }}
        healthCheck:
          {{- include "kubehenge.healthCheck" "workers" | nindent 10 }}
  variables:
    {{- include "kubehenge.proxmoxVariables" (dict "controlPlaneDiskGiB" 30 "workerDiskGiB" 40 "minDiskGiB" 20 "workerMinCores" 1 "workerMinMemoryMiB" 1024 "clusters" .Values.clusters) | nindent 4 }}
    {{- include "kubehenge.addonVariables" . | nindent 4 }}
    {{- include "kubehenge.upgradeVariables" . | nindent 4 }}
    {{- include "kubehenge.oidcVariable" . | nindent 4 }}
    {{- include "kubehenge.cisVariable" . | nindent 4 }}
    - name: cni
      required: false
      schema:
        openAPIV3Schema:
          type: string
          description: The CNI plugin, fixed once the cluster exists. k3s's own is flannel.
          enum: [flannel, cilium, calico]
          default: flannel
          {{- include "kubehenge.cniFixed" . | nindent 10 }}
  patches:
    {{- include "kubehenge.proxmoxPatches" . | nindent 4 }}
    - name: k3s-control-plane
      definitions:
        - selector:
            apiVersion: controlplane.cluster.x-k8s.io/v1beta2
            kind: KThreesControlPlaneTemplate
            matchResources:
              controlPlane: true
          jsonPatches:
            - op: add
              path: /spec/template/spec/kthreesConfigSpec/files/-
              valueFrom:
                template: |
                  {{- include "kubehenge.kubeVipFile" (dict "root" . "path" "/var/lib/rancher/k3s/agent/pod-manifests/kube-vip.yaml" "kubeconfig" "/etc/rancher/k3s/k3s.yaml") | nindent 18 }}
            - op: add
              path: /spec/template/spec/kthreesConfigSpec/files/-
              valueFrom:
                template: |
                  {{- include "kubehenge.admissionFile" (dict "root" . "path" "/etc/rancher/k3s/pod-security.yaml") | nindent 18 }}
            # The file is on the servers before k3s starts, so its Traefik never runs on k3s's own
            # values. Traefik runs as RKE2 runs its own, on every node's ports 80 and 443, rather
            # than behind k3s's servicelb, so that it answers there whatever load balancer the
            # cluster has. Routes whose TLS options conflict fail rather than fall back to the
            # defaults, which would drop a host's client-certificate check (GHSA-g55h-rg46-x9c5). Its
            # Gateway API provider is on, as in the Traefik Kubehenge installs into kubeadm clusters.
            # What follows the cluster's certificates comes from the values Secret it names, which
            # Kubehenge keeps in the running cluster: in the file, every change of it would replace
            # the servers.
            - op: add
              path: /spec/template/spec/kthreesConfigSpec/files/-
              valueFrom:
                template: |
                  path: /var/lib/rancher/k3s/server/manifests/traefik-config.yaml
                  owner: root:root
                  permissions: "0600"
                  content: |
                    apiVersion: helm.cattle.io/v1
                    kind: HelmChartConfig
                    metadata:
                      name: traefik
                      namespace: kube-system
                    spec:
                      {{- include "kubehenge.traefikValuesSecrets" . | nindent 22 }}
                      valuesContent: |-
                        deployment:
                          kind: DaemonSet
                        updateStrategy:
                          rollingUpdate:
                            maxUnavailable: 1
                            maxSurge: 0
                        ports:
                          web:
                            hostPort: 80
                          websecure:
                            hostPort: 443
                        service:
                          spec:
                            type: ClusterIP
                        providers:
                          kubernetesIngress:
                            publishedService:
                              enabled: false
                          kubernetesGateway:
                            enabled: true
                            statusAddress:
                              ip: {{ "{{ .controlPlaneEndpoint | quote }}" }}
                        core:
                          strictTLSOptions: true
                        {{- include "kubehenge.traefikGatewayValues" . | nindent 24 }}
    # The k3s provider takes the ranges only from its own server configuration, never from the
    # Cluster's clusterNetwork, which Kubehenge's range check and every other distribution read.
    {{- range $range := list (dict "name" "pods" "field" "clusterCidr") (dict "name" "services" "field" "serviceCidr") }}
    - name: k3s-{{ $range.name }}
      enabledIf: {{ printf "{{ if .builtin.cluster.network.%s }}true{{ end }}" $range.name | quote }}
      definitions:
        - selector:
            apiVersion: controlplane.cluster.x-k8s.io/v1beta2
            kind: KThreesControlPlaneTemplate
            matchResources:
              controlPlane: true
          jsonPatches:
            - op: add
              path: /spec/template/spec/kthreesConfigSpec/serverConfig/{{ $range.field }}
              valueFrom:
                template: {{ printf "{{ join \",\" .builtin.cluster.network.%s | quote }}" $range.name | quote }}
    {{- end }}
    # The k3s provider has no setting for flannel's backend, so a drop-in beside its config.yaml
    # switches flannel and k3s's network policy controller off; the agents follow the servers.
    - name: k3s-cni
      enabledIf: {{ "{{ if ne .cni \"flannel\" }}true{{ end }}" | quote }}
      definitions:
        - selector:
            apiVersion: controlplane.cluster.x-k8s.io/v1beta2
            kind: KThreesControlPlaneTemplate
            matchResources:
              controlPlane: true
          jsonPatches:
            - op: add
              path: /spec/template/spec/kthreesConfigSpec/files/-
              value:
                path: /etc/rancher/k3s/config.yaml.d/50-kubehenge-cni.yaml
                owner: root:root
                permissions: "0600"
                content: |
                  flannel-backend: none
                  disable-network-policy: true
    # Cilium chains the portmap plugin for host ports (ciliumValues), but k3s without flannel
    # leaves containerd's plugins in /opt/cni/bin, where Cilium installs only its own; k3s carries
    # portmap among the plugins of its data directory, which it has unpacked by the time pods start.
    - name: k3s-cilium-portmap
      enabledIf: {{ "{{ if eq .cni \"cilium\" }}true{{ end }}" | quote }}
      definitions:
        {{- range $kind, $sel := dict "KThreesControlPlaneTemplate" (dict "selector" (dict "controlPlane" true) "api" "controlplane.cluster.x-k8s.io/v1beta2" "commands" "/spec/template/spec/kthreesConfigSpec/preK3sCommands/-") "KThreesConfigTemplate" (dict "selector" (dict "machineDeploymentClass" (dict "names" (list "worker"))) "api" "bootstrap.cluster.x-k8s.io/v1beta2" "commands" "/spec/template/spec/preK3sCommands/-") }}
        - selector:
            apiVersion: {{ $sel.api }}
            kind: {{ $kind }}
            matchResources:
              {{- toYaml $sel.selector | nindent 14 }}
          jsonPatches:
            - op: add
              path: {{ $sel.commands }}
              value: mkdir -p /opt/cni/bin && ln -sfn /var/lib/rancher/k3s/data/current/bin/portmap /opt/cni/bin/portmap
        {{- end }}
    # servicelb would answer for the same Services as the cluster's own load balancer.
    - name: k3s-load-balancer
      enabledIf: {{ "{{ with .loadBalancer }}{{ if .enabled }}true{{ end }}{{ end }}" | quote }}
      definitions:
        - selector:
            apiVersion: controlplane.cluster.x-k8s.io/v1beta2
            kind: KThreesControlPlaneTemplate
            matchResources:
              controlPlane: true
          jsonPatches:
            - op: add
              path: /spec/template/spec/kthreesConfigSpec/serverConfig/disableComponents
              value: [servicelb]
    - name: k3s-oidc
      enabledIf: {{ include "kubehenge.oidcEnabled" . }}
      definitions:
        - selector:
            apiVersion: controlplane.cluster.x-k8s.io/v1beta2
            kind: KThreesControlPlaneTemplate
            matchResources:
              controlPlane: true
          jsonPatches:
            - op: add
              path: /spec/template/spec/kthreesConfigSpec/files/-
              valueFrom:
                template: |
                  {{- include "kubehenge.oidcFile" (dict "root" . "path" "/etc/rancher/k3s/authentication-config.yaml" "anonymous" false) | nindent 18 }}
            - op: add
              path: /spec/template/spec/kthreesConfigSpec/files/-
              value:
                path: /etc/rancher/k3s/config.yaml.d/45-kubehenge-oidc.yaml
                owner: root:root
                permissions: "0600"
                content: |
                  kube-apiserver-arg+:
                    - authentication-config=/etc/rancher/k3s/authentication-config.yaml
    - name: k3s-cis
      enabledIf: {{ include "kubehenge.cisEnabled" . }}
      definitions:
        {{- range $kind, $sel := dict "KThreesControlPlaneTemplate" (dict "selector" (dict "controlPlane" true) "api" "controlplane.cluster.x-k8s.io/v1beta2" "args" "/spec/template/spec/kthreesConfigSpec/agentConfig/kubeletArgs/-") "KThreesConfigTemplate" (dict "selector" (dict "machineDeploymentClass" (dict "names" (list "worker"))) "api" "bootstrap.cluster.x-k8s.io/v1beta2" "args" "/spec/template/spec/agentConfig/kubeletArgs/-") }}
        - selector:
            apiVersion: {{ $sel.api }}
            kind: {{ $kind }}
            matchResources:
              {{- toYaml $sel.selector | nindent 14 }}
          jsonPatches:
            {{- range fromYamlArray (include "kubehenge.cisKubeletArgs" $) }}
            - op: add
              path: {{ $sel.args }}
              value: {{ . }}
            {{- end }}
        {{- end }}
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha2
kind: ProxmoxClusterTemplate
metadata:
  name: {{ $clusterName }}
  namespace: {{ .Release.Namespace }}
spec:
  {{- $clusterSpec | nindent 2 }}
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha2
kind: ProxmoxMachineTemplate
metadata:
  name: {{ $machineName }}
  namespace: {{ .Release.Namespace }}
spec:
  {{- $machineSpec | nindent 2 }}
---
{{ include "kubehenge.classTemplates" (dict "class" $class "namespace" .Release.Namespace "templates" (list
  (dict "apiVersion" "controlplane.cluster.x-k8s.io/v1beta2" "kind" "KThreesControlPlaneTemplate" "name" $controlPlaneName "spec" $controlPlaneSpec)
  (dict "apiVersion" "bootstrap.cluster.x-k8s.io/v1beta2" "kind" "KThreesConfigTemplate" "name" $workerName "spec" $workerSpec)
)) }}

{{- define "kubehenge.k3sAgentConfig" -}}
preK3sCommands:
  - sysctl --system
  - {{ include "kubehenge.runcProfileLoad" . | quote }}
agentConfig:
  kubeletArgs:
    # capmox names a machine by its VM's SMBIOS UUID, which cloud-init reads as the instance ID.
    - provider-id=proxmox://{{ "{{ ds.meta_data.instance_id }}" }}
    # The kubelet refuses to start on kernel settings other than its own (kubehenge.sysctlFile).
    - protect-kernel-defaults=true
    - tls-cipher-suites={{ include "kubehenge.tlsCipherSuites" . }}
    # servicelb's pods set these in their own network namespace, and k3s allows them only on nodes
    # whose servicelb is on: while the control planes roll to switch it back on, an old server
    # would refuse every pod servicelb gives it, and the next one would hold up its drain.
    - allowed-unsafe-sysctls=net.ipv4.ip_forward,net.ipv6.conf.all.forwarding
  {{- if .controlPlane }}
  {{- include "kubehenge.controlPlaneTaints" . | nindent 2 }}
  {{- end }}
{{- end -}}

{{- define "kubehenge.k3sControlPlaneSpec" -}}
template:
  spec:
    kthreesConfigSpec:
      {{- include "kubehenge.k3sAgentConfig" (dict "controlPlane" true) | nindent 6 }}
      files:
        {{- include "kubehenge.sysctlFile" . | nindent 8 }}
        {{- include "kubehenge.runcProfileFile" (dict "distribution" "k3s") | nindent 8 }}
        {{- include "kubehenge.auditPolicyFile" (dict "root" . "path" "/etc/rancher/k3s/audit-policy.yaml") | nindent 8 }}
        # The k3s provider has no setting for secrets encryption; k3s keeps the key in its
        # datastore, so every server holds the same one. The API server's arguments are here, in
        # place of the provider's list, which always ends with anonymous-auth=true and a cipher list
        # of its own; a later file only adds to them (kube-apiserver-arg+).
        - path: /etc/rancher/k3s/config.yaml.d/40-kubehenge-server.yaml
          owner: root:root
          permissions: "0600"
          content: |
            secrets-encryption: true
            kube-apiserver-arg:
              - admission-control-config-file=/etc/rancher/k3s/pod-security.yaml
              - enable-admission-plugins=NodeRestriction,EventRateLimit
              - audit-policy-file=/etc/rancher/k3s/audit-policy.yaml
              - audit-log-path=/var/lib/rancher/k3s/server/logs/audit.log
              # A month of it, in at most a gigabyte, as RKE2 keeps its own.
              - audit-log-maxage=30
              - audit-log-maxbackup=10
              - audit-log-maxsize=100
              # Every client reloads its projected token, so none needs it to outlast its hour.
              - service-account-extend-token-expiration=false
              - anonymous-auth=false
              - tls-cipher-suites={{ include "kubehenge.tlsCipherSuites" . }}
      serverConfig:
        # The Proxmox VE cloud controller manager initialises the nodes instead of k3s's own.
        disableCloudController: true
        cloudProviderName: external
        etcdProxyImage: {{ .Values.etcdProxy }}
        kubeControllerManagerArgs:
          {{- include "kubehenge.patientLeaseArgs" . | nindent 10 }}
        kubeSchedulerArgs:
          {{- include "kubehenge.patientLeaseArgs" . | nindent 10 }}
{{- end -}}

{{- define "kubehenge.k3sWorkerSpec" -}}
template:
  spec:
    {{- include "kubehenge.k3sAgentConfig" (dict) | nindent 4 }}
    files:
      {{- include "kubehenge.sysctlFile" . | nindent 6 }}
      {{- include "kubehenge.runcProfileFile" (dict "distribution" "k3s") | nindent 6 }}
{{- end -}}
