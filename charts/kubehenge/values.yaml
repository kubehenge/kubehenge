---
# Digest of the chart's files. The management cluster's module sets it: the Helm provider upgrades a
# release only when its chart's version or its values change.
chartDigest: ""

# Proxmox VE pool the management cluster's Cluster API token manages. Each workload cluster's VMs go
# into a pool of their own nested under it, named <workloadPool>/<namespace>.<cluster name>.
workloadPool: kubehenge

# Namespaces of the Cluster API providers only one ClusterClass's clusters use, by class. Their
# controllers run only while a cluster is built from it: the controller scales them to none when the
# last one is gone, and back up before the next one's control plane and bootstrap templates are
# applied, which need their webhooks.
providerNamespaces:
  kubehenge-kubeadm: [kubeadm-bootstrap-system, kubeadm-control-plane-system]
  kubehenge-rke2: [rke2-bootstrap-system, rke2-control-plane-system]
  kubehenge-k3s: [k3s-bootstrap-system, k3s-control-plane-system]

interface:
  # Namespace the web interface creates clusters in; it changes and hands out kubeconfigs only of
  # the clusters there. Their pools are <workloadPool>/<namespace>.<cluster name>.
  namespace: clusters
  # More namespaces the interface creates, changes and hands out kubeconfigs of clusters in, with
  # the same rights as in namespace, such as one per team. The chart creates each one that does not
  # exist yet and keeps it when it leaves this list, so that the clusters in it stay; the
  # interface's rights there go. A namespace of Kubernetes', the providers' or Kubehenge's own
  # (default, kube-*, *-system, cert-manager) is refused.
  extraNamespaces: []
  # Whether those who may create or change a cluster, but not read Proxmox VE's HA rules (Sys.Audit
  # on /), are offered the HA node-affinity rules as places for its VMs: their names and nodes,
  # never their comments or resources. The controller reads them with its own token, which holds
  # Sys.Audit on / already, into the ConfigMap kubehenge-ha-rules, which only then the interface
  # may read.
  offerHARules: false
  # Whether the appliance's shared Headlamp signs those who may download a cluster's admin
  # kubeconfig (Sys.Modify on its pool) in as cluster-admin, with a token made for their session.
  # The controller then keeps two identities in each cluster of namespace and extraNamespaces: one
  # bound to cluster-admin, and one that may only make its tokens, whose own token it keeps beside
  # the Cluster for the interface. Switched off, it removes them, which ends every token made.
  headlampSignIn: false
  # Whether the appliance's shared Headlamp offers the Helm app catalog and the Prometheus charts
  # it ships with: listing, installing, upgrading, rolling back and uninstalling Helm releases from
  # repositories, with each user's own credentials in the cluster. Only those who may set the
  # appliance up (Sys.Modify on / among others) add or remove a repository, as one list serves
  # every user and cluster. The interface reads this from the ConfigMap kubehenge-interface.
  headlampActions: false

# What clusters may use on Proxmox VE: the storages for their disks and volumes, and the bridges
# their nodes attach to, which the management cluster's Cluster API token has rights on. The
# ClusterClasses refuse any other; empty lists leave the choice to Proxmox VE's own checks.
clusters:
  storages: []
  bridges: []

# OpenID Connect providers every new cluster's API server trusts unless the cluster names its own
# (its oidc variable): a list of {issuerURL, clientID, usernameClaim, usernamePrefix, groupsClaim,
# groupsPrefix, scopes, certificateAuthority}. Tokens and certificates work beside them.
clusterOIDC: []

# S3 stores clusters that switch backups on back up to, each under a prefix of its own beneath the
# target's: a list of {name, endpoint, bucket, region, prefix, caCertificate, checksums}. endpoint
# is the store's https:// URL, unset for AWS S3 itself; caCertificate the PEM CA of its
# certificate when the system's do not cover it; checksums false for a store that refuses the
# checksums the AWS SDK sends. A cluster brings its own keys for the store.
backupTargets: []

# Namespaces whose pods neither Pod Security Admission nor Kyverno holds to a cluster's pod
# security level: those of the components that need the host's network, file system or
# privileges (the cloud controller manager, the CSI plugin, the CNIs, node-exporter, Alloy's node
# collectors, Velero's node agents, Rancher's agents and controllers). A cluster's own workloads
# that need it get their namespace labelled instead.
podSecurityExempt:
  - kube-system
  - tigera-operator
  - calico-system
  - node-exporter
  - logging-node
  - velero
  - istio-node
  - metallb-system
  - cattle-system
  - cattle-fleet-system
  - cattle-fleet-local-system
  - cattle-turtles-system

# Kubehenge's controller image by digest, repository@sha256:<digest>: a release's chart names the
# one it was released with, and a checkout's needs one given.
image: ""

proxmox:
  # The Proxmox VE API, such as https://pve.example.org:8006. Required.
  url: ""
  # Skip verifying the API's certificate, in the controller and in the clusters' cloud controller
  # manager and CSI plugin.
  insecure: false
  # Secret in the release namespace with the controller's API token (key token, as
  # user@realm!name=secret) and the CA that signed the API's certificate (key ca.crt).
  secret: kubehenge-proxmox
  # Group each cluster's Proxmox VE user joins, holding the storage and node rights clusters share.
  clusterGroup: kubehenge-clusters
  # Role each cluster's user gets on its own pool.
  clusterRole: kubehenge-cluster
  # Node for the VMs that own clusters' volumes; empty means the first online node.
  volumeOwnerNode: ""
  # Region the clusters see Proxmox VE as (topology.kubernetes.io/region); empty means the Proxmox
  # VE cluster's name, or the node's when it is not clustered.
  region: ""
  # Whether the controller keeps clusters' control-plane VMs apart with Proxmox VE HA, signing in
  # for it with the API token under the secret's key ha-token, which needs Sys.Audit and Sys.Console
  # on /.
  ha: false
  # Clusters that choose the CSI plugin's newest release (their csi variable) get this role on their
  # storage from the controller: Datastore.Allocate, Datastore.AllocateSpace and Datastore.Audit,
  # which the controller's token must hold there itself. Empty: no cluster may choose it.
  # managementStorages are those the management cluster uses, which no cluster may get it on.
  datastoreAllocate:
    role: ""
    managementStorages: []
  # Group holding Sys.Audit on /, unpropagated, that the controller adds the user of each cluster
  # asking for the cloud controller manager's HA group labels (its ccm variable) to; the
  # controller's token needs User.Modify on /access/groups/<group>. Empty: no cluster may ask for
  # them.
  sysAuditGroup: ""
  # Secret in the release namespace holding root@pam's password (key password), with which the CSI
  # plugin of each cluster that takes volume snapshots (its csi variable's volumeSnapshots) signs
  # in: the plugin copies volumes through a method only root@pam may call. Written by the
  # appliance, never by this chart. Empty: no cluster may take them.
  volumeSnapshots:
    rootSecret: ""
  # Whether the controller restores clusters' etcd from their snapshots itself, running the restore
  # on the control-plane VMs through their guest agents, signing in for it with the API token under
  # the secret's key restore-token, which needs VM.Audit and VM.GuestAgent.Unrestricted on the
  # workload pool: a root shell in every cluster's VMs. Without it, the interface shows the steps
  # to restore by hand.
  etcdRestore: false

# Building the Ubuntu VM templates again every week, with the updates Ubuntu published since, as a
# CronJob signed in with a token of its own. Clusters move their nodes to a new build inside their
# maintenance windows (their upgrades variable's nodeImages) once it is soakHours old; of each
# template the two newest builds stay, and any older one a cluster still clones from.
templateRefresh:
  # On, as with the module and the appliance. It needs node, storage and importStorage below and the
  # builder's Secret; set enabled to false to install without them.
  enabled: true
  # When the weekly build starts: a weekday (Mon to Sun), a time as HH:MM, and its IANA time zone.
  weekday: Sun
  time: "01:00"
  timeZone: UTC
  # How old a build is before clusters move to it, giving a broken one time to be noticed.
  soakHours: 24
  # Secret in the release namespace with the builder's API token, key token, which needs the
  # privileges docs/install.md lists. The CA is read from proxmox.secret.
  secret: kubehenge-template-builder
  # Where the templates are built, as kubehenge template create's flags of the same names: the node,
  # the storage of their disks, the file storage the image is downloaded to (import content), the
  # storage of the cloud-init ISO while an image is prepared, and the template pool.
  node: ""
  storage: ""
  importStorage: ""
  isoStorage: ""
  pool: kubehenge-templates
  # The network of the VM that prepares an image, which needs Ubuntu's and Kubernetes' package
  # mirrors: a bridge and VLAN tag, and a static address with prefix, gateway and DNS servers, or
  # DHCP when address is empty.
  bridge: vmbr0
  vlan: 0
  address: ""
  gateway: ""
  dns: []
  # Whether those who may create clusters may have a missing template built, such as for a
  # Kubernetes version no kubeadm template exists for yet. The builds run here, with the builder's
  # token, one at a time; the interface asks for them and never starts one itself.
  creatorBuilds: false

# kube-vip, which holds each cluster's API address on its control planes and, where it is the
# cluster's load balancer, its Services' addresses.
# renovate: datasource=docker depName=ghcr.io/kube-vip/kube-vip
kubeVip: ghcr.io/kube-vip/kube-vip:v1.3.1@sha256:1962f9daf226503f7e6b107f595cb28b7917fd2d0113957075e19a3e5a6c1e33

# The management cluster's API as workload clusters reach it, such as https://192.0.2.10:6443; the
# management cluster's module sets it. Without it, no cluster's autoscaler can run inside the
# cluster (the autoscaler variable's placement workload).
managementEndpoint: ""

# The cluster autoscaler the controller runs for each cluster with an autoscaled pool.
autoscaler:
  # Namespace of the autoscalers that run in the management cluster and their accounts.
  namespace: kubehenge-autoscaler
  # A release for each Kubernetes minor version, as each carries its minor's scheduler. A cluster
  # runs the one of its minor, else the newest before it; one older than them all, the oldest. A
  # new minor is a new line: Renovate moves each line within its own minor.
  images:
    # renovate: datasource=docker depName=registry.k8s.io/autoscaling/cluster-autoscaler
    - registry.k8s.io/autoscaling/cluster-autoscaler:v1.33.6@sha256:7b44e0f075b2c8f9952e339b6c396cd4d1c3831c24c0fe092a3e708c45e6ec51
    # renovate: datasource=docker depName=registry.k8s.io/autoscaling/cluster-autoscaler
    - registry.k8s.io/autoscaling/cluster-autoscaler:v1.34.5@sha256:5c3a56440ffc76eac79e7d7e840153c1fbe7b6e02d415e76a45ba2e0ef99a266
    # renovate: datasource=docker depName=registry.k8s.io/autoscaling/cluster-autoscaler
    - registry.k8s.io/autoscaling/cluster-autoscaler:v1.35.2@sha256:aac369dc283927a623deb1af54696efcc722ae79255aa07788422e495bab887d
    # renovate: datasource=docker depName=registry.k8s.io/autoscaling/cluster-autoscaler
    - registry.k8s.io/autoscaling/cluster-autoscaler:v1.36.1@sha256:461388d03eb5b55db58941ee7a81d9a619dd15302b01cbab9f5a9946715994b4

# The proxy on k3s control planes through which Cluster API reaches each node's etcd; the k3s
# provider would otherwise pull it by tag alone.
# renovate: datasource=docker depName=docker.io/alpine/socat
etcdProxy: docker.io/alpine/socat:1.8.1.3@sha256:22d77becaeeea8ef56b8c4bb2312323acafe85354be6a85714ff5050e3537842

# Installed into clusters: the Proxmox VE cloud controller manager and CSI plugin into every one,
# the CNI chosen for a cluster whose distribution has none of its own (kubeadm), and the add-ons a
# cluster switches on. Each chart's version carries its digest, which it is pulled by: an OCI
# chart's manifest digest, or the sha256 of the archive that a repository's index lists. A chart's
# values, beneath those Kubehenge gives it, name each image it runs by tag and digest, as one tag
# where the chart joins it to the repository; Cilium's chart pins its own.
addons:
  headlamp:
    repository: https://kubernetes-sigs.github.io/headlamp
    chart: headlamp
    version: 0.46.0@sha256:faa471a8c5c55125b3dceed1cf73000e1ced18f07e2088e5e12e75292fb9ae62
    values:
      image:
        # renovate: datasource=docker depName=ghcr.io/headlamp-k8s/headlamp
        tag: v0.46.0@sha256:8a0ef97527544baa2b35825940ddf4db6e2d09c30cd5aa31fd269ff604cc8b75
  rancher:
    repository: https://releases.rancher.com/server-charts/stable
    chart: rancher
    version: 2.15.2@sha256:855cb9be954f65a31b9a8c77f7aebce125c2d7797425257d21d35e3380816ac8
    # Kubernetes minor versions this Rancher release runs on (its chart's kubeVersion and support
    # matrix); the cluster that installs it is held within them.
    kubernetes: 34-36
    # Turtles, which Rancher installs itself and whose Cluster API its registered clusters need, and
    # the Cluster API controller it runs: those of the rancher-turtles chart this Rancher release
    # installs, so they move with Rancher. Kubehenge's controller hands them to Rancher.
    turtles:
      image: docker.io/rancher/turtles:v0.27.2@sha256:fff10f34feffcf0fc583ffb51975e9e6f2839c65d54f96668790bbb770456512
      clusterAPI: docker.io/rancher/cluster-api-controller:v1.13.3@sha256:80f8775553807ddba520dcbfd84da42fbfdfbd36036fc2f9238b1ad423649309
    values:
      image:
        # renovate: datasource=docker depName=docker.io/rancher/rancher
        tag: v2.15.2@sha256:0c3d8e5702555b2bfd2ec3fe7a6e5f95484a28fcb9787c498db3e5b0f62652ea
      # Rancher reads a setting from CATTLE_<NAME> before its own object, and starts the agent and
      # shell images exactly as named here. Imported-cluster version management would upgrade RKE2
      # and k3s beside Cluster API, with images it names by tag alone.
      extraEnv:
        - name: CATTLE_IMPORTED_CLUSTER_VERSION_MANAGEMENT
          value: "false"
        - name: CATTLE_AGENT_IMAGE
          # renovate: datasource=docker depName=docker.io/rancher/rancher-agent
          value: rancher/rancher-agent:v2.15.2@sha256:fb006776b7ee42818ed1e2575bc2015e33ec64d6799545ba72e4297e43ce22a3
        - name: CATTLE_SHELL_IMAGE
          value: rancher/shell:v0.8.2@sha256:1eeed72d4eda486de13403c4ae6e9d29a0842edc35d0f4a8fb7b0dab79d04be9
      # The webhook's and Fleet's charts, which Rancher installs itself, read these from its
      # rancher-config ConfigMap. From here on, and the shell image above, each is the one this
      # Rancher release names, so they move with Rancher.
      webhook:
        image:
          repository: rancher/rancher-webhook
          tag: v0.11.3@sha256:6d76ccda60ab030b898e615730a037c8f59a4cc9f7d04b49f7f5bd1be6c23e3f
      fleet:
        image:
          repository: rancher/fleet
          tag: v0.16.2@sha256:31f39589e1f876ebafe8af05e2aabf1ee0b553fb94d2f8aaf8ea691b67fe66ca
        agentImage:
          repository: rancher/fleet-agent
          tag: v0.16.2@sha256:9bed916e5a2307ac4a6c752f809964364464de71bdd47f95009f4be657e071c7
      preUpgrade:
        image:
          tag: v0.8.2@sha256:1eeed72d4eda486de13403c4ae6e9d29a0842edc35d0f4a8fb7b0dab79d04be9
      postDelete:
        image:
          tag: v0.8.2@sha256:1eeed72d4eda486de13403c4ae6e9d29a0842edc35d0f4a8fb7b0dab79d04be9
      auditLog:
        image:
          tag: 16.0-15.11@sha256:c05817e6ec52af611e2d1e2e901b4c0c8e57ad49e516e2faca25d046d8deff89
  # Prometheus, Alertmanager and Grafana, for clusters that switch monitoring on.
  monitoring:
    repository: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    version: 92.11.0@sha256:c357a259965187edcbed86591461bfbd56997591afba09be3a49a09b2bec8a2c
    # In front of the metrics etcd, kube-proxy and node-exporter serve without authentication.
    # renovate: datasource=docker depName=ghcr.io/kube-rbac-proxy/kube-rbac-proxy
    kubeRBACProxy: ghcr.io/kube-rbac-proxy/kube-rbac-proxy:v0.23.0@sha256:296fd0a10fb635414b4533b983f0d5a686ce0ce73567b7079b6595ba75034f1a
    values:
      prometheusOperator:
        image:
          # renovate: datasource=docker depName=quay.io/prometheus-operator/prometheus-operator
          tag: v0.94.1@sha256:7c88d4e7bae63bd8d0f8da986054337c23b4472fa8d3c6817f5bc4b8407a2d6a
        prometheusConfigReloader:
          image:
            # yamllint disable-line rule:line-length
            # renovate: datasource=docker depName=quay.io/prometheus-operator/prometheus-config-reloader
            tag: v0.94.1@sha256:06b52bd4dbe3ed6dd5905aadaf8b9987d9da4c31d37bb86deaadae68cee2d26b
        admissionWebhooks:
          deployment:
            image:
              # renovate: datasource=docker depName=quay.io/prometheus-operator/admission-webhook
              tag: v0.94.1@sha256:691ecb7e05ce81b899639c187da7614ffa12698a60ab8e2747f454c0efb3a55e
          patch:
            image:
              # renovate: datasource=docker depName=ghcr.io/jkroepke/kube-webhook-certgen
              tag: 1.11.0@sha256:778d97dc3986355625e14392419b3364c487a7c807d4d86ddad1df369129b082
        thanosImage:
          # renovate: datasource=docker depName=quay.io/thanos/thanos
          tag: v0.42.4@sha256:b567818fe608067eb0f1d7c2c4fe361e7ad83c8a256234c97685f1d0bf670cc8
        # The chart's one second is less than a TLS handshake takes on a node whose CPU every
        # add-on starting at once keeps busy, so the operator was restarted while working.
        livenessProbe:
          timeoutSeconds: 5
      # The chart takes the version it gives the operator from the image's tag unless one is
      # set, and the operator cannot read one with a digest in it.
      prometheus:
        prometheusSpec:
          image:
            # renovate: datasource=docker depName=quay.io/prometheus/prometheus
            tag: v3.15.1-distroless@sha256:451a845bae1d51622b41af1780eb2ad911bbb79a9855bc8e9bb67fabbc03f934
          # renovate: datasource=docker depName=quay.io/prometheus/prometheus depType=version
          version: v3.15.1
      alertmanager:
        alertmanagerSpec:
          image:
            # renovate: datasource=docker depName=quay.io/prometheus/alertmanager
            tag: v0.34.1@sha256:e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a
          # renovate: datasource=docker depName=quay.io/prometheus/alertmanager depType=version
          version: v0.34.1
      thanosRuler:
        thanosRulerSpec:
          image:
            # renovate: datasource=docker depName=quay.io/thanos/thanos
            tag: v0.42.4@sha256:b567818fe608067eb0f1d7c2c4fe361e7ad83c8a256234c97685f1d0bf670cc8
      grafana:
        image:
          # renovate: datasource=docker depName=docker.io/grafana/grafana
          tag: 13.2.4-distroless@sha256:ae3d3add290adbe6a88412229f5d76fd7bb82743050881698642d3d62f277e35
        sidecar:
          image:
            # renovate: datasource=docker depName=quay.io/kiwigrid/k8s-sidecar
            tag: 2.14.1@sha256:092dbe0c335fba9af414a27630ca68f34df6185784fa847d9954187e69dbfdd7
        testFramework:
          image:
            # renovate: datasource=docker depName=docker.io/bats/bats
            tag: 1.14.0@sha256:5322b877351fda0cc435de8c6116de7d0a2ec79d7c680132a0ef329a633bc66f
      kube-state-metrics:
        image:
          # yamllint disable-line rule:line-length
          # renovate: datasource=docker depName=registry.k8s.io/kube-state-metrics/kube-state-metrics
          tag: v2.20.0@sha256:42cfe3723a5f058171c627537fb57a3ea0f26e4380fa18555a95cb1a1b4cfc5b
      prometheus-node-exporter:
        image:
          # The whole reference: the chart adds -distroless to a tag of its own.
          # renovate: datasource=docker depName=quay.io/prometheus/node-exporter
          tag: quay.io/prometheus/node-exporter:v1.12.1-distroless@sha256:8c9bac11973b94b59be88d6e11fee4429aa743c8846cdc75d65b18db33f6a106
  # Loki, which keeps the logs of clusters that switch logs on, and Grafana Alloy, which collects
  # them.
  loki:
    repository: https://grafana-community.github.io/helm-charts
    chart: loki
    version: 19.0.3@sha256:bf3e8a09821c0f7aae095314fcbf16a20ee101e00523dcf0ddada2ae99821a99
    values:
      loki:
        image:
          # renovate: datasource=docker depName=docker.io/grafana/loki
          tag: 3.7.9@sha256:0db216b630ae1f348a1584c67f3cead8b4c1fc839169a39501db664744158e28
  alloy:
    repository: https://grafana.github.io/helm-charts
    chart: alloy
    version: 1.14.1@sha256:4b31686f69ef1e3280382cb311a40edb555ecf8ed049770e3efe5da70d614d53
    # The whole reference: the chart puts its tag into a label, where a digest cannot go.
    # renovate: datasource=docker depName=docker.io/grafana/alloy
    image: docker.io/grafana/alloy:v1.21.1@sha256:4039c971193053a84e53dd9ed3e7d4561c069256b024631cd3498a353ed7ece8
  # Velero, for clusters that switch backups on, with its plugin for S3. The chart's own image
  # trails Velero's releases, so the controller names Velero's image itself, which also restores
  # the volumes of the pods it brings back.
  velero:
    repository: https://vmware-tanzu.github.io/helm-charts
    chart: velero
    version: 12.2.1@sha256:fe4acd70a0123c369e7af7064457b4ffdddebee413e2bb01976a4fe07c471773
    # renovate: datasource=docker depName=docker.io/velero/velero
    image: docker.io/velero/velero:v1.18.4@sha256:c89fb5b6d1fd6afd368e0f483e6f5555fd62851a1eada8ac5c72482e674ca17b
    # renovate: datasource=docker depName=docker.io/velero/velero-plugin-for-aws
    plugin: docker.io/velero/velero-plugin-for-aws:v1.14.4@sha256:c85a7fa803569e3128c33e4f5766f84ab156c8d171c9f1dd2715581d45ce98fa
  # Kyverno and its Pod Security Standards policies, for clusters that have Kyverno enforce pod
  # security.
  kyverno:
    repository: https://kyverno.github.io/kyverno
    chart: kyverno
    version: 3.9.2@sha256:f6fe7184544d5e2ee33a77808c09e67aa603ce6560cc197038fde31d727c861e
    values:
      admissionController:
        initContainer:
          image:
            # renovate: datasource=docker depName=reg.kyverno.io/kyverno/kyvernopre
            tag: v1.19.2@sha256:27f3cc52e628559b56d08363b85316819802086c9808606914f7805a244148f4
        container:
          image:
            # renovate: datasource=docker depName=reg.kyverno.io/kyverno/kyverno
            tag: v1.19.2@sha256:c8c4dd09e720d2cd7fd24ca73ac28e46651001372f988e0cba3f2f612f04b955
      backgroundController:
        image:
          # renovate: datasource=docker depName=reg.kyverno.io/kyverno/background-controller
          tag: v1.19.2@sha256:c46e124f21ef8a6bb4b48de57106808b1007edcd5ddd4ff7df5d23b9efa60ce2
      cleanupController:
