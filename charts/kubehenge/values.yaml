      image:
        # renovate: datasource=docker depName=ghcr.io/headlamp-k8s/headlamp
        tag: v0.46.0@sha256:8a0ef97527544baa2b35825940ddf4db6e2d09c30cd5aa31fd269ff604cc8b75
  rancher:
    repository: https://releases.rancher.com/server-charts/stable
    chart: rancher
    version: 2.15.2@sha256:855cb9be954f65a31b9a8c77f7aebce125c2d7797425257d21d35e3380816ac8
    # Kubernetes minor versions this Rancher release runs on (its chart's kubeVersion and support
    # matrix); the cluster that installs it is held within them.
    kubernetes: 34-36
