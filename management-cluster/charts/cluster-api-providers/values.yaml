---
# Digest of the chart's files. The module sets it: the Helm provider upgrades a release only when
# its chart's version or its values change.
chartDigest: ""

namespaces: []
# Each provider's object, and the files the operator installs it from, which the release's hook
# downloads and checks: manifests.metadata and manifests.components, each as
# <https URL>@sha256:<digest>.
providers: []
secrets: {}

# Kubehenge's controller image by digest, whose `kubehenge manifests` and `kubehenge wait` the
# release's hooks run.
image: ""

# How long the release waits, before its changes, for the operator's webhooks to answer, and after
# them for the providers' manifests to be stored and every provider to be installed and rolled out.
waitTimeoutSeconds: 600
